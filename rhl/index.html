<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen de Cierre — Aliah Lomas Verdes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.js"></script>
<style>
:root{
  --olive:#484D31;--green:#5F6844;--sage:#A4AC8C;
  --charcoal:#282823;--light:#F8F8F8;--white:#FFFFFF;
  --brass:#B08D57;--brass-dark:#8C6D40;--error:#9A3B3B;
  --border:#E8E6DF;--muted:#8B8B83;--radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--light);font-family:'DM Sans',sans-serif;color:var(--charcoal);-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Outfit',sans-serif;}
.wrap{max-width:1480px;margin:0 auto;padding:0 28px 80px;}

/* HEADER */
header{background:var(--charcoal);color:var(--white);padding:22px 0 18px;}
.hdr-inner{max-width:1480px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.hdr-left{display:flex;align-items:center;gap:20px;}
.brand-logo{height:44px;opacity:.92;}
.hdr-text .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);margin:0 0 4px;font-weight:500;}
.hdr-text h1{font-size:20px;margin:0;font-weight:600;display:flex;align-items:center;gap:10px;}
.rhl-badge{font-size:10px;font-weight:700;letter-spacing:.1em;background:rgba(176,141,87,.25);color:var(--brass);padding:2px 8px;border-radius:4px;vertical-align:middle;font-family:'DM Sans',sans-serif;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.ver-label{font-size:12px;color:rgba(255,255,255,.4);}
.ver-live{font-size:10px;color:var(--sage);display:none;letter-spacing:.05em;}
.admin-trigger{background:none;border:none;color:rgba(255,255,255,.15);cursor:pointer;font-size:14px;padding:2px 3px;line-height:1;transition:color .2s;margin-top:2px;}
.admin-trigger:hover{color:rgba(255,255,255,.5);}

.row-x{float:right;background:none;border:none;color:var(--border);cursor:pointer;
  font-size:11px;line-height:1;padding:2px 4px;opacity:0;transition:all .15s;}
tr:hover .row-x{opacity:1;color:var(--muted);}
.row-x:hover{color:var(--error);}
.chip-nueva{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  background:rgba(95,104,68,.14);color:var(--green);padding:1px 7px;border-radius:9px;margin-left:8px;}
.add-partida{background:none;border:1px dashed var(--border);border-radius:8px;color:var(--muted);
  cursor:pointer;font-size:12px;font-weight:600;padding:8px 16px;margin:12px 0 0;
  font-family:'DM Sans',sans-serif;transition:all .15s;}
.add-partida:hover{border-color:var(--olive);color:var(--olive);background:rgba(72,77,49,.04);}

/* GATE DE LOGIN */
#gate{position:fixed;inset:0;z-index:9000;background:var(--charcoal);
  display:flex;align-items:center;justify-content:center;padding:24px;}
#gate.oculto{display:none;}
.gate-box{background:var(--white);border-radius:18px;padding:40px 38px;width:100%;max-width:400px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);}
.gate-box img{height:46px;margin-bottom:26px;opacity:.9;}
.gate-box h2{font-size:19px;margin:0 0 6px;font-weight:600;}
.gate-box p.sub{font-size:13px;color:var(--muted);margin:0 0 24px;}
.gate-box label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
.gate-box input{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 13px;
  font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:16px;}
.gate-box input:focus{outline:none;border-color:var(--brass);}
.gate-box button{width:100%;background:var(--olive);color:#fff;border:none;border-radius:9px;
  padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
.gate-box button:hover{background:var(--green);}
.gate-err{background:rgba(154,59,59,.09);border:1px solid rgba(154,59,59,.3);color:var(--error);
  border-radius:8px;padding:10px 13px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:none;}
.gate-err.on{display:block;}

/* PALANCAS */
.palancas{background:var(--white);border:1px solid var(--border);border-left:3px solid var(--brass);
  border-radius:var(--radius);padding:16px 20px;margin:20px 0 4px;
  display:flex;flex-wrap:wrap;align-items:center;gap:26px;}
.pal-grp{display:flex;align-items:center;gap:10px;}
.pal-lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.pal-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.pal-seg button{background:var(--white);border:none;padding:6px 13px;font-size:12px;font-weight:600;
  font-family:'DM Sans',sans-serif;color:var(--muted);cursor:pointer;transition:all .14s;white-space:nowrap;}
.pal-seg button + button{border-left:1px solid var(--border);}
.pal-seg button.on{background:var(--olive);color:var(--white);}
.pal-seg button:not(.on):hover{background:var(--light);color:var(--charcoal);}
.pal-monto{width:118px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;
  font-size:12px;font-family:'DM Sans',sans-serif;text-align:right;color:var(--charcoal);}
.pal-monto:focus{outline:none;border-color:var(--brass);}
.pal-sep{width:1px;align-self:stretch;background:var(--border);}
.pal-aviso{display:none;width:100%;font-size:12px;color:var(--brass-dark);font-weight:600;
  padding-top:12px;border-top:1px dashed var(--border);align-items:center;gap:10px;}
.pal-aviso.on{display:flex;}
.pal-aviso button{background:var(--brass);color:#fff;border:none;border-radius:6px;
  padding:4px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
.pal-guardar{background:var(--olive);color:#fff;border:none;border-radius:7px;padding:6px 14px;
  font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
.pal-guardar:hover{background:var(--green);}

/* SELLO DE CRITERIO EN HEADER */
.sello{font-size:11px;color:var(--sage);letter-spacing:.02em;}
.sello b{color:var(--white);font-weight:600;}

/* PROVISION — se ve distinta porque no es cifra cerrada */
tr.provision td{font-style:italic;color:var(--muted)!important;}
.chip-est{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  background:rgba(176,141,87,.15);color:var(--brass-dark);padding:1px 7px;border-radius:9px;margin-left:8px;
  font-style:normal;vertical-align:middle;}

/* VALIDACION CONSOLIDADO */
.valida{display:none;align-items:center;gap:9px;background:rgba(154,59,59,.08);
  border:1px solid rgba(154,59,59,.35);border-radius:9px;padding:10px 15px;margin:12px 0 0;
  font-size:12.5px;color:var(--error);font-weight:600;}
.valida.on{display:flex;}

/* CORTE PICKER */
.corte-picker{display:flex;align-items:center;gap:7px;}
.corte-picker label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);}
.corte-picker input[type=date]{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:var(--white);
  border-radius:7px;padding:4px 8px;font-size:12px;font-family:'DM Sans',sans-serif;color-scheme:dark;cursor:pointer;}
.corte-picker input[type=date]:hover{border-color:rgba(255,255,255,.34);}
.corte-reset{background:none;border:none;color:var(--sage);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;}
.corte-reset:hover{color:var(--white);}
.corte-banner{display:none;align-items:center;gap:10px;background:rgba(176,141,87,.11);border:1px solid rgba(176,141,87,.4);
  border-left:3px solid var(--brass);border-radius:9px;padding:10px 16px;margin:20px 0 0;font-size:13px;color:var(--brass-dark);font-weight:500;}
.corte-banner.on{display:flex;}
.corte-banner b{color:var(--charcoal);}

/* TABS */
.tabs{display:flex;margin:28px 0 0;border-bottom:2px solid var(--border);}
.tab{padding:12px 28px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:'DM Sans',sans-serif;background:none;border-top:none;border-left:none;border-right:none;}
.tab:hover{color:var(--charcoal);}
.tab.active{color:var(--olive);border-bottom-color:var(--brass);}

/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
.card-title{font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 16px;}

/* HERO ROW */
.hero-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0 16px;}
.stat-tile{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;}
.stat-label{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:500;}
.stat-value{font-size:32px;font-weight:700;font-family:'Outfit',sans-serif;margin:0;line-height:1.1;}
.stat-value.hero{font-size:42px;}
.stat-delta{font-size:13px;margin:6px 0 0;font-weight:600;}
.stat-delta.pos{color:var(--green);}
.stat-delta.neg{color:var(--error);}
.stat-sub{font-size:12px;color:var(--muted);margin:4px 0 0;}

/* EQUITY TILES */
.equity-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 20px;}
.eq-tile{background:rgba(72,77,49,.05);border:1px solid rgba(72,77,49,.18);border-radius:var(--radius);padding:18px 20px;}
.eq-tile-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--olive);margin:0 0 5px;}
.eq-tile-value{font-size:26px;font-weight:700;font-family:'Outfit',sans-serif;margin:0;color:var(--charcoal);}
.eq-tile-sub{font-size:11px;color:var(--muted);margin:3px 0 0;}
.equity-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.equity-card-hdr .card-title{margin:0;}
.equity-badge{font-size:10px;font-weight:700;letter-spacing:.07em;background:rgba(176,141,87,.12);color:var(--brass-dark);padding:2px 9px;border-radius:12px;}

/* CHARTS */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
.chart-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:24px;}
.chart-wrap{position:relative;height:260px;}
@media(max-width:900px){.charts-row{grid-template-columns:1fr;}}

/* LOGRADO */
.logrado-section{margin:20px 0;}
.logrado-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.logrado-bar-wrap{margin:10px 0;}
.logrado-label{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
.logrado-track{background:var(--border);border-radius:6px;height:26px;overflow:hidden;}
.logrado-fill{height:100%;border-radius:6px 0 0 6px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:#fff;transition:width .4s ease;}
.logrado-values{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;}
.logrado-expect{font-size:11px;font-weight:700;color:var(--charcoal);letter-spacing:.01em;}

/* SCENARIO CHIPS */
.scen-filters{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 0 6px;}
.scen-filters-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px;white-space:nowrap;}
.scen-chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:var(--white);transition:all .15s;white-space:nowrap;}
.scen-chip.active{background:var(--charcoal);color:var(--white);border-color:var(--charcoal);}
.scen-chip:hover{border-color:var(--muted);}

/* DATA TABLE */
.tbl-wrap{overflow-x:auto;margin:0;}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
table.data th{background:var(--charcoal);color:var(--white);padding:10px 14px;text-align:right;font-weight:600;position:sticky;top:0;white-space:nowrap;font-size:12px;}
table.data th:first-child{text-align:left;border-radius:10px 0 0 0;}
table.data th:last-child{border-radius:0 10px 0 0;}
table.data td{padding:8px 14px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top;}
table.data td:first-child{text-align:left;font-weight:500;}
table.data tr.section-hdr td{background:rgba(164,172,140,.12);font-weight:700;color:var(--olive);font-size:11px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;}
table.data tr.section-hdr:hover td{background:rgba(164,172,140,.2);}
table.data tr.row-total td{font-weight:700;background:rgba(164,172,140,.06);}
table.data tr.row-hero td{font-weight:700;background:rgba(176,141,87,.08);color:var(--brass-dark);font-size:14px;}
table.data tr.row-pct td{color:var(--muted);font-size:12px;}
table.data tr.row-expandable td:first-child{cursor:pointer;}
table.data tr.row-expandable td:first-child::before{content:"▸ ";color:var(--brass);}
table.data tr.row-expandable.open td:first-child::before{content:"▾ ";}
table.data tr.detail-row{display:none;}
table.data tr.detail-row.show{display:table-row;}
table.data tr.detail-row td{padding-left:32px;font-size:12px;color:var(--muted);background:rgba(176,141,87,.04);}
.val-neg{color:var(--error);}
.val-cell{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.delta-chip{font-size:10px;font-weight:700;letter-spacing:.02em;padding:1px 5px;border-radius:3px;line-height:1.4;}
.delta-chip.dp{color:#3d6b35;background:rgba(95,104,68,.1);}
.delta-chip.dn{color:var(--error);background:rgba(154,59,59,.08);}
.delta-chip.dn-exp{color:#3d6b35;background:rgba(95,104,68,.1);}
.delta-chip.dp-exp{color:var(--error);background:rgba(154,59,59,.08);}
.sec-arrow{display:inline-block;width:14px;text-align:center;color:var(--brass);margin-right:4px;}
.sc-tag{font-size:9px;font-weight:700;letter-spacing:.06em;background:rgba(176,141,87,.15);color:var(--brass-dark);padding:1px 6px;border-radius:3px;margin-left:6px;text-transform:none;vertical-align:middle;}

/* Numeric editing highlight */
td[data-num-key][contenteditable=true]:focus{
  background:rgba(176,141,87,.12)!important;
  border-radius:4px;
  outline:1px solid var(--brass);
}
td[data-num-key][contenteditable=true]{cursor:text;outline:none;}
.edit-mode-banner{display:none;background:rgba(72,77,49,.07);border:1px solid rgba(72,77,49,.2);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--olive);margin-bottom:10px;align-items:center;gap:10px;}
.edit-mode-banner.show{display:flex;}

/* Ocultar columnas de escenario — hasta 6 columnas no-Base */
table.data.hide-col-1 tr>:nth-child(3){display:none;}
table.data.hide-col-2 tr>:nth-child(4){display:none;}
table.data.hide-col-3 tr>:nth-child(5){display:none;}
table.data.hide-col-4 tr>:nth-child(6){display:none;}
table.data.hide-col-5 tr>:nth-child(7){display:none;}
table.data.hide-col-6 tr>:nth-child(8){display:none;}

/* TAB CONTENT */
.tab-content{display:none;animation:fadeIn .2s ease;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

/* VERTIENTES */
.vertientes-wrap{margin:20px 0;}
.vertientes-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;padding:14px 18px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);font-weight:700;font-size:13px;font-family:'Outfit',sans-serif;color:var(--charcoal);user-select:none;transition:background .15s;}
.vertientes-toggle:hover{background:var(--light);}
.vertientes-toggle .sec-arrow{color:var(--brass);}
.vertientes-body{display:none;background:var(--white);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:20px;}
.vertientes-body.open{display:block;}
.vertientes-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.vertiente-card{border:1px solid var(--border);border-radius:12px;padding:20px;}
.vertiente-card h3{font-size:13px;font-weight:700;margin:0 0 14px;color:var(--charcoal);}
.vertiente-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.vertiente-row:last-child{border-bottom:none;}
.vertiente-row .label{color:var(--muted);font-weight:500;}
.vertiente-row .value{font-weight:700;font-family:'Outfit',sans-serif;}
.vertiente-row.highlight .value{color:var(--brass-dark);font-size:15px;}

/* ADMIN MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(40,40,35,.55);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:flex-start;justify-content:flex-end;padding:70px 28px 0;}
.modal-backdrop.open{display:flex;}
.admin-modal{background:var(--white);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.22);width:420px;max-width:calc(100vw - 40px);max-height:82vh;overflow-y:auto;display:flex;flex-direction:column;}
.modal-head{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:1;}
.modal-head h2{margin:0;font-size:15px;font-weight:700;font-family:'Outfit',sans-serif;}
.modal-close{background:none;border:none;cursor:pointer;font-size:17px;color:var(--muted);padding:2px 7px;border-radius:6px;line-height:1;}
.modal-close:hover{background:var(--border);}
.modal-body{padding:18px 22px 22px;flex:1;}
.modal-section{margin-bottom:18px;}
.modal-section:last-child{margin-bottom:0;}
.modal-section h3{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px;}
.form-group{margin-bottom:10px;}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;}
.form-group input[type=text],.form-group input[type=email],.form-group input[type=password]{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;background:var(--light);transition:border-color .15s;}
.form-group input[type=file]{width:100%;padding:6px 0;font-size:12px;cursor:pointer;}
.form-group input:focus{border-color:var(--olive);}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--olive);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--green);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--charcoal);}
.btn-ghost:hover{background:var(--border);}
.btn-danger{background:none;border:1px solid rgba(154,59,59,.3);color:var(--error);}
.btn-danger:hover{background:rgba(154,59,59,.05);}
.btn-sm{padding:4px 11px;font-size:11px;border-radius:6px;}
.ver-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
.ver-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:12px;}
.ver-item.active-ver{border-color:var(--sage);background:rgba(164,172,140,.06);}
.ver-item-info{flex:1;min-width:0;}
.ver-item-label{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ver-item-meta{font-size:10px;color:var(--muted);margin-top:2px;}
.badge-active{font-size:10px;font-weight:700;background:rgba(72,77,49,.1);color:var(--olive);padding:2px 8px;border-radius:4px;white-space:nowrap;}
.status-msg{font-size:12px;padding:8px 11px;border-radius:8px;margin-top:10px;}
.status-msg.ok{background:rgba(72,77,49,.08);color:var(--green);}
.status-msg.err{background:rgba(154,59,59,.08);color:var(--error);}
.status-msg.info{background:rgba(164,172,140,.1);color:var(--muted);}
.user-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;background:var(--light);border-radius:8px;font-size:12px;margin-bottom:14px;}
.user-email{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sep-line{border:none;border-top:1px solid var(--border);margin:16px 0;}

/* LABELS EDITOR */
.labels-editor{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:0 10px;}
.label-edit-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);}
.label-edit-row:last-child{border-bottom:none;}
.label-default{font-size:10px;color:var(--muted);min-width:0;flex:0 0 auto;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.label-inp{flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--light);outline:none;transition:border-color .15s;}
.label-inp:focus{border-color:var(--olive);}
.label-sec-hdr{font-size:10px;font-weight:700;color:var(--olive);text-transform:uppercase;letter-spacing:.06em;padding:8px 0 2px;display:block;}

/* BREAKDOWN HC/SC */
.bkd-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.bkd-header-left{flex:1;min-width:0;}
.bkd-title{font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;margin:0 0 4px;color:var(--charcoal);}
.bkd-subtitle{font-size:12px;color:var(--muted);margin:0;}
.bkd-semaforo{padding:12px 18px;border-radius:var(--radius);font-size:13px;font-weight:700;font-family:'Outfit',sans-serif;
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap;}
.bkd-semaforo .bkd-sem-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.bkd-semaforo .bkd-sem-value{font-size:22px;line-height:1.1;}
.bkd-semaforo.verde{background:rgba(72,77,49,.08);border:1px solid rgba(72,77,49,.25);color:var(--green);}
.bkd-semaforo.ambar{background:rgba(176,141,87,.1);border:1px solid rgba(176,141,87,.4);color:var(--brass-dark);}
.bkd-semaforo.rojo{background:rgba(154,59,59,.08);border:1px solid rgba(154,59,59,.3);color:var(--error);}
.bkd-reconciliacion{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.bkd-rec-tile{flex:1;min-width:160px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.bkd-rec-tile .bkd-rec-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;}
.bkd-rec-tile .bkd-rec-value{font-size:20px;font-weight:700;font-family:'Outfit',sans-serif;margin:0;color:var(--charcoal);}
.bkd-rec-tile.ancla{border-left:3px solid var(--brass);}
.bkd-rec-tile.ancla .bkd-rec-value{color:var(--brass-dark);}
.bkd-bars{margin-bottom:20px;}
.bkd-bar-row{margin-bottom:10px;}
.bkd-bar-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;margin-bottom:4px;}
.bkd-bar-label .pct{color:var(--muted);font-weight:500;}
.bkd-bar-track{background:var(--border);border-radius:6px;height:22px;overflow:hidden;}
.bkd-bar-fill{height:100%;border-radius:6px 0 0 6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#fff;transition:width .4s ease;}
.bkd-bar-fill.hc{background:var(--olive);}
.bkd-bar-fill.sc{background:var(--brass);}
.bkd-tbl-wrap{overflow-x:auto;}
table.bkd-data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
table.bkd-data th{background:var(--charcoal);color:var(--white);padding:9px 14px;text-align:right;font-weight:600;font-size:12px;white-space:nowrap;}
table.bkd-data th:first-child{text-align:left;border-radius:10px 0 0 0;}
table.bkd-data th:last-child{border-radius:0 10px 0 0;}
table.bkd-data td{padding:7px 14px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top;}
table.bkd-data td:first-child{text-align:left;font-weight:500;}
table.bkd-data tr.bkd-total td{font-weight:700;background:rgba(164,172,140,.06);}
table.bkd-data tr.bkd-brecha td{font-weight:700;background:rgba(176,141,87,.08);color:var(--brass-dark);font-size:14px;}
table.bkd-data tr:hover td{background:rgba(164,172,140,.04);}
table.bkd-data tr.bkd-total:hover td{background:rgba(164,172,140,.1);}
table.bkd-data tr.bkd-brecha:hover td{background:rgba(176,141,87,.12);}
.bkd-detail-btn{background:none;border:none;color:var(--brass);cursor:pointer;font-size:11px;font-weight:700;padding:0;text-decoration:underline;font-family:'DM Sans',sans-serif;}
.bkd-detail-btn:hover{color:var(--brass-dark);}
.bkd-modal-overlay{position:fixed;inset:0;background:rgba(40,40,35,.55);backdrop-filter:blur(3px);z-index:2000;
  display:flex;align-items:center;justify-content:center;padding:24px;}
.bkd-detail-modal{background:var(--white);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.22);
  width:560px;max-width:calc(100vw - 48px);max-height:80vh;overflow-y:auto;padding:28px;}
.bkd-detail-modal h3{font-size:15px;font-weight:700;margin:0 0 6px;font-family:'Outfit',sans-serif;}
.bkd-detail-modal .bkd-det-source{font-size:11px;color:var(--muted);margin:0 0 16px;}
.bkd-detail-modal table{width:100%;}
.bkd-detail-modal .bkd-det-close{position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;font-size:17px;color:var(--muted);padding:2px 7px;border-radius:6px;line-height:1;}
.bkd-detail-modal .bkd-det-close:hover{background:var(--border);}

/* ABSORCION Y FLUJOS — Tab 5 */
.abs-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px;}
.abs-hero .stat-tile{position:relative;}
.abs-phase-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.abs-sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.abs-torres-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.abs-torre-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.abs-torre-card h4{font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;margin:0 0 8px;color:var(--charcoal);}
.abs-torre-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border);}
.abs-torre-row:last-child{border-bottom:none;}
.abs-torre-row .lbl{color:var(--muted);}
.abs-torre-row .val{font-weight:600;}
.abs-cobro-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.abs-cobro-label{font-size:12px;font-weight:600;min-width:120px;}
.abs-cobro-bar{flex:1;background:var(--border);border-radius:6px;height:20px;overflow:hidden;}
.abs-cobro-fill{height:100%;border-radius:6px 0 0 6px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:700;color:#fff;transition:width .4s ease;}
.abs-cobro-fill.cobrado{background:var(--olive);}
.abs-cobro-fill.vencido{background:var(--error);}
.abs-cobro-fill.por-cobrar{background:var(--brass);}
.abs-cobro-val{font-size:11px;font-weight:600;min-width:90px;text-align:right;}
.abs-flujos-tbl-wrap{overflow-x:auto;max-height:500px;overflow-y:auto;}
table.abs-flujos{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;}
table.abs-flujos th{background:var(--charcoal);color:var(--white);padding:7px 10px;text-align:right;font-weight:600;font-size:11px;white-space:nowrap;position:sticky;top:0;z-index:1;}
table.abs-flujos th:first-child{text-align:left;border-radius:10px 0 0 0;position:sticky;left:0;z-index:2;background:var(--charcoal);}
table.abs-flujos th:last-child{border-radius:0 10px 0 0;}
table.abs-flujos td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
table.abs-flujos td:first-child{text-align:left;font-weight:500;position:sticky;left:0;background:var(--white);z-index:1;}
table.abs-flujos tr.abs-flujos-total td{font-weight:700;background:rgba(164,172,140,.08);}
table.abs-flujos tr:hover td{background:rgba(164,172,140,.04);}
table.abs-flujos tr.abs-flujos-total:hover td{background:rgba(164,172,140,.12);}
.abs-status-chip{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:9px;}
.abs-status-chip.vendido{background:rgba(72,77,49,.12);color:var(--green);}
.abs-status-chip.disponible{background:rgba(176,141,87,.12);color:var(--brass-dark);}
.abs-status-chip.apartado{background:rgba(164,172,140,.15);color:var(--olive);}
.abs-upload-progress{width:100%;height:6px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden;display:none;}
.abs-upload-progress.on{display:block;}
.abs-upload-progress .fill{height:100%;background:var(--olive);border-radius:3px;transition:width .3s ease;width:0%;}
.abs-tab-nav{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0;}
.abs-tab-btn{padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'DM Sans',sans-serif;transition:all .15s;}
.abs-tab-btn:hover{color:var(--charcoal);}
.abs-tab-btn.on{color:var(--olive);border-bottom-color:var(--brass);}
.abs-panel{display:none;}
.abs-panel.on{display:block;}

@media(max-width:700px){
  .hero-row{grid-template-columns:1fr 1fr;}
  .stat-value.hero{font-size:30px;}
  .logrado-grid,.vertientes-grid,.equity-row{grid-template-columns:1fr;}
  .modal-backdrop{align-items:flex-end;justify-content:center;padding:0;}
  .admin-modal{width:100%;max-width:100%;border-radius:var(--radius) var(--radius) 0 0;max-height:88vh;}
  .bkd-header{flex-direction:column;}
  .bkd-semaforo{align-items:flex-start;width:100%;}
  .bkd-reconciliacion{flex-direction:column;}
  .bkd-detail-modal{width:100%;max-width:100%;border-radius:var(--radius) var(--radius) 0 0;}
  .abs-sub-grid{grid-template-columns:1fr;}
  .abs-torres-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>

/* ===== PARTIDAS: agregar, quitar, restaurar =====
   ROWS_BASE son las del Excel. currentData.extraRows guarda las que agregas,
   currentData.hiddenRows las que quitas. Nada se borra del modelo: quitar es
   ocultar, para que siempre se pueda volver atras. */
function partidasOcultas(){ return new Set(currentData.hiddenRows || []); }
function partidasExtra(){  return currentData.extraRows || []; }

function construirROWS(){
  const ocultas = partidasOcultas();
  const extras  = partidasExtra();
  const out = [];
  for(const r of ROWS_BASE){
    if(ocultas.has(r.key)) continue;
    out.push(r);
    // las partidas nuevas se insertan despues de su ancla
    for(const e of extras){
      if(e.despues === r.key && !ocultas.has(e.key)){
        out.push({key:e.key, label:e.label, fmt:fmtFull, type:'data',
                  isExpense:e.isExpense !== false, esNueva:true});
      }
    }
  }
  return out;
}

/* Alta de partida. Se crea con ceros en todos los escenarios y entra a la
   cascada como cualquier otra: si es gasto operativo suma al total. */
function agregarPartida(){
  if(!puedeEditar()){ alert('Solo el admin puede agregar partidas.'); return; }
  const label = prompt('Nombre de la partida nueva:');
  if(!label || !label.trim()) return;
  const grupo = prompt(
    'A que grupo pertenece?\n\n'+
    '1 = Gastos Operativos (SC 1)\n'+
    '2 = Gastos de Comercializacion (SC 2)\n'+
    '3 = Gastos Financieros (SC 3)\n\n'+
    'Escribe 1, 2 o 3:', '1');
  const ANCLA = {'1':'sat', '2':'comisionComercializacion', '3':'otrosGastosFin'};
  const GRUPO = {'1':'operativos', '2':'comercializacion', '3':'financieros'};
  const g = ANCLA[grupo] ? grupo : '1';
  const key = 'x_' + label.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,28)
            + '_' + Math.floor(Math.random()*9000+1000);
  currentData.extraRows = currentData.extraRows || [];
  currentData.extraRows.push({key, label:label.trim(), despues:ANCLA[g],
                              grupo:GRUPO[g], isExpense:true});
  // arranca en cero en todos los escenarios de las tres pestanas
  ['e1','e2','cons'].forEach(t=>{
    if(!currentData[t]) return;
    currentData[t].data[key] = currentData[t].scenarios.map(()=>0);
  });
  EDITABLE_KEYS.add(key);
  bitacora('partidas','estructura',key,null,label.trim(),null,'Alta de partida');
  aplicarPalancas();
}

function quitarPartida(key, label){
  if(!puedeEditar()){ alert('Solo el admin puede quitar partidas.'); return; }
  if(!confirm(`Quitar "${label}" de la vista?\n\nNo se borra el dato: se puede restaurar desde el panel de administracion.`)) return;
  currentData.hiddenRows = currentData.hiddenRows || [];
  if(!currentData.hiddenRows.includes(key)) currentData.hiddenRows.push(key);
  bitacora('partidas','estructura',key,label,'(oculta)',null,'Partida quitada de la vista');
  aplicarPalancas();
}

function restaurarPartida(key){
  currentData.hiddenRows = (currentData.hiddenRows||[]).filter(k=>k!==key);
  bitacora('partidas','estructura',key,'(oculta)','(visible)',null,'Partida restaurada');
  aplicarPalancas();
  renderAdminBody();
}

async function guardarEstructura(){
  if(!supa || !isAdmin) return;
  const ver = await obtenerOCrearVersion();
  if(!ver){ alert('No se pudo guardar.'); return; }
  const nd = {...ver.data,
    extraRows: currentData.extraRows || [],
    hiddenRows: currentData.hiddenRows || [],
    e1: currentData.e1, e2: currentData.e2, cons: currentData.cons};
  const {error} = await supa.from('cierre_versiones').update({data:nd}).eq('id',ver.id);
  alert(error ? ('No se pudo guardar: '+error.message) : 'Estructura de partidas guardada.');
}

const CONS_INPUTS = ['ingresos','costoObra','gestionLicencias','contratistaGeneral',
  'indirectoCorp','gastosOpObra','proyectoEjecutivo','activosFijos','legal','sat',
  'publicidad','comisionComercializacion','interesesBX','comisionAperturaBX',
  'otrosGastosFin','adelantoEtapa2','equipamiento','tierraBase',
  'recEquipamiento','recNegociacion','recCargadores','recElevadores'];

function derivarConsolidado(){
  if(!currentData.e1 || !currentData.e2 || !currentData.cons) return;
  const a = currentData.e1.data, b = currentData.e2.data, c = currentData.cons.data;
  const ia = currentData.e1.scenarios.length - 1;
  const ib = currentData.e2.scenarios.length - 1;
  CONS_INPUTS.forEach(k => {
    c[k] = c[k] || [];
    c[k][0] = (a[k]?.[ia] || 0) + (b[k]?.[ib] || 0);
  });
  c.aniosProy = [9];
}

function recalculate(tabKey) {
  if(tabKey === 'cons') derivarConsolidado();
  const tab = currentData[tabKey];
  if (!tab || !tab.data) return;
  const d = tab.data;
  const n = tab.scenarios.length;
  const P = currentData.palancas || {tierra:'capital', cpcMonto:15000000, cpcEtapa:'e2'};
  const EQ = currentData.equityTotal || 0;

  for (let i = 0; i < n; i++) {
    // --- PALANCA CPC: contratos por cerrar — aditiva al HC del ultimo mes solamente.
    //     Si cpcMonto es 0, no hay efecto. En consolidado siempre entra.
    const isLast = (i === n - 1);
    const cpc = isLast
      ? ((tabKey === 'cons')
          ? (P.cpcMonto || 0)
          : (P.cpcEtapa === tabKey ? (P.cpcMonto || 0) : 0))
      : 0;
    d.cpc = d.cpc || [];
    d.cpc[i] = cpc;

    /* Recuperaciones: partidas que vuelven al socio — se calculan antes del HC
       para netear el costo visible. "Hoy suman pero se van a recuperar." */
    const ocultas = new Set(currentData.hiddenRows || []);
    const viva = k => !ocultas.has(k);
    d.porRecuperar = d.porRecuperar || [];
    d.porRecuperar[i] = ['recEquipamiento','recNegociacion','recCargadores','recElevadores']
      .filter(viva).reduce((a,k)=>a+(d[k]?.[i]||0),0);

    d.sumaHC = d.sumaHC || [];
    d.sumaHC[i] = (d.costoObra[i] || 0) + cpc - d.porRecuperar[i];

    d.utilidadBruta = d.utilidadBruta || [];
    d.utilidadBruta[i] = (d.ingresos[i] || 0) - d.sumaHC[i];

    d.totalGastosOperativos = d.totalGastosOperativos || [];
    /* Quitar una partida la saca de la suma, igual que borrar un renglon en Excel.
       El dato no se pierde: sigue en el modelo y se puede restaurar. */
    const extraDe = g => (currentData.extraRows||[])
        .filter(e => e.grupo===g && viva(e.key))
        .reduce((a,e) => a + (d[e.key]?.[i] || 0), 0);
    d.totalGastosOperativos[i] = ['gestionLicencias','contratistaGeneral','indirectoCorp',
      'gastosOpObra','proyectoEjecutivo','activosFijos','legal','sat']
      .filter(viva).reduce((s, k) => s + (d[k]?.[i] || 0), 0) + extraDe('operativos');

    d.totalGastosComercializacion = d.totalGastosComercializacion || [];
    d.totalGastosComercializacion[i] = ['publicidad','comisionComercializacion']
      .filter(viva).reduce((s,k)=>s+(d[k]?.[i]||0),0) + extraDe('comercializacion');

    d.utilidadOperativa = d.utilidadOperativa || [];
    d.utilidadOperativa[i] = d.utilidadBruta[i] - d.totalGastosOperativos[i]
                           - d.totalGastosComercializacion[i];

    d.totalGastosFinancieros = d.totalGastosFinancieros || [];
    d.totalGastosFinancieros[i] = ['interesesBX','comisionAperturaBX','otrosGastosFin']
      .filter(viva).reduce((s,k)=>s+(d[k]?.[i]||0),0) + extraDe('financieros');

    // --- PALANCA 1: la tierra entra al P&L solo bajo el criterio de gasto operativo
    const tierra = (P.tierra === 'gasto') ? (d.tierraBase?.[i] || 0) : 0;
    d.totalCostoTierra = d.totalCostoTierra || [];
    d.totalCostoTierra[i] = tierra;

    d.utilidadNeta = d.utilidadNeta || [];
    d.utilidadNeta[i] = d.utilidadOperativa[i] - d.totalGastosFinancieros[i]
                      - tierra - (d.adelantoEtapa2[i]||0) - (d.equipamiento[i]||0);

    d.margen = d.margen || [];
    d.margen[i] = d.ingresos[i] ? d.utilidadNeta[i] / d.ingresos[i] : 0;

    /* Comision de comercializacion (listing) = 2% de ingresos */
    d.comisionListing = d.comisionListing || [];
    d.comisionListing[i] = (d.ingresos[i]||0) * 0.02;

    /* Devolucion total al socio. El Excel suma dos veces "Por recuperar"
       (el subtotal y sus cuatro componentes); aqui se cuenta una sola vez. */
    d.devolucion = d.devolucion || [];
    d.devolucion[i] = d.utilidadNeta[i] + (d.contratistaGeneral[i]||0)
                    + d.comisionListing[i] + d.porRecuperar[i];

    // --- Base de inversion: cambia con la palanca de tierra
    d.inversionSocios = d.inversionSocios || [];
    d.inversionSocios[i] = (P.tierra === 'capital') ? EQ : (d.tierraBase?.[i] || 0);

    if (!d.aniosProy[i]) d.aniosProy[i] = (tabKey === 'e1' ? 6 : 9);

    // --- Multiplo y TIR sobre la base vigente
    d.multiplo = d.multiplo || [];
    d.multiplo[i] = d.inversionSocios[i] ? d.utilidadNeta[i] / d.inversionSocios[i] : 0;
    d.tir = d.tir || [];
    d.tir[i] = d.multiplo[i] / (d.aniosProy[i] || 1);
  }
}




/* ===== BACKFILL DE ESQUEMA =====
   Una version guardada en Supabase puede haberse creado antes de que
   existieran ciertas partidas. Sin esto, esas filas salen vacias aunque
   el HTML si las traiga. Se rellena solo lo que falte; nunca se pisa
   un dato que la version guardada ya tenga. */
function rellenarFaltantes(destino, base){
  if(!destino || !base) return destino;
  ['e1','e2','cons'].forEach(t=>{
    if(!base[t]) return;
    if(!destino[t]){ destino[t] = JSON.parse(JSON.stringify(base[t])); return; }
    const dd = destino[t].data || (destino[t].data = {});
    const bd = base[t].data || {};
    const n  = (destino[t].scenarios || []).length;
    Object.keys(bd).forEach(k=>{
      if(Array.isArray(dd[k]) && dd[k].length) return;   // ya lo tiene
      const src = bd[k];
      dd[k] = Array.isArray(src)
        ? Array.from({length:n}, (_,i)=> src[i] !== undefined ? src[i] : (src[src.length-1] ?? 0))
        : src;
      faltantesRellenados.push(`${t}.${k}`);
    });
  });
  ['equityTotal','palancas','criterioCorte','fechaCorte'].forEach(k=>{
    if(destino[k] === undefined && base[k] !== undefined) destino[k] = base[k];
  });
  /* Backfill de logrado: si Supabase no tiene absorcion, usar la de EMBEDDED_DATA */
  if(base.logrado){
    if(!destino.logrado) destino.logrado = JSON.parse(JSON.stringify(base.logrado));
    else {
      ['e1','e2'].forEach(etapa=>{
        if(!base.logrado[etapa]) return;
        if(!destino.logrado[etapa]){ destino.logrado[etapa] = JSON.parse(JSON.stringify(base.logrado[etapa])); return; }
        Object.keys(base.logrado[etapa]).forEach(mes=>{
          if(!destino.logrado[etapa][mes]){ destino.logrado[etapa][mes] = JSON.parse(JSON.stringify(base.logrado[etapa][mes])); return; }
          if(!destino.logrado[etapa][mes].absorcion && base.logrado[etapa][mes].absorcion){
            destino.logrado[etapa][mes].absorcion = JSON.parse(JSON.stringify(base.logrado[etapa][mes].absorcion));
            faltantesRellenados.push(`logrado.${etapa}.${mes}.absorcion`);
          }
        });
      });
    }
  }
  return destino;
}
let faltantesRellenados = [];

/* ===== GATE DE LOGIN ===== */
function mostrarGate(msg){
  document.getElementById('gate')?.classList.remove('oculto');
  const e=document.getElementById('gate-err');
  if(e){ e.textContent = msg||''; e.classList.toggle('on', !!msg); }
}
function ocultarGate(){ document.getElementById('gate')?.classList.add('oculto'); }

async function entrar(){
  const mail=(document.getElementById('gate-mail')?.value||'').trim();
  const pass=document.getElementById('gate-pass')?.value||'';
  if(!mail||!pass){ mostrarGate('Captura correo y contrasena.'); return; }
  if(!supa){ mostrarGate('No hay conexion con el servidor.'); return; }
  const {data,error}=await supa.auth.signInWithPassword({email:mail,password:pass});
  if(error){ mostrarGate('Correo o contrasena incorrectos.'); return; }
  userSession=data.session;
  await arrancarSesion();
}

async function arrancarSesion(){
  await checkAdminRole();
  await loadActiveVersion();
  await cargarCortes();
  await loadVersionHistory();
  // Cargar defaults de palancas_default (tabla nueva)
  try{
    const {data:pd} = await supa.from('palancas_default')
      .select('*').eq('dashboard_id',DASHBOARD_ID).single();
    if(pd){
      PAL_DEFAULT.tierra   = pd.tierra || 'capital';
      PAL_DEFAULT.cpcMonto = parseFloat(pd.contratos_monto) || 0;
      PAL_DEFAULT.cpcEtapa = pd.contratos_etapa || 'e2';
    }
  }catch(e){ console.warn('palancas_default load:', e); }
  if(!currentData.palancas) currentData.palancas = JSON.parse(JSON.stringify(PAL_DEFAULT));
  // Asegurar que CPC existe en palancas (backfill para versiones viejas)
  if(currentData.palancas.cpcMonto === undefined) currentData.palancas.cpcMonto = PAL_DEFAULT.cpcMonto || 15000000;
  if(currentData.palancas.cpcEtapa === undefined) currentData.palancas.cpcEtapa = PAL_DEFAULT.cpcEtapa || 'e2';
  recalculate('e1'); recalculate('e2'); recalculate('cons');
  fijarRefConsolidado();
  await cargarBreakdown();
  await cargarAbsorcion();
  pintarBannerCorte();
  pintarPalancas();
  renderAll();
  ocultarGate();
}

async function salir(){
  if(supa) await supa.auth.signOut();
  userSession=null; isAdmin=false; versionHistory=[];
  location.reload();
}

/* ===== VERSION ACTIVA: obtener o crear =====
   Sin este upsert, el primer guardado falla con
   "Cannot coerce the result to a single JSON object" porque no hay fila. */
async function obtenerOCrearVersion(){
  if(!supa || !isAdmin) return null;
  const {data:rows, error} = await supa.from('cierre_versiones')
    .select('id,data').eq('dashboard_id',DASHBOARD_ID).eq('is_active',true).limit(1);
  if(error){ console.warn(error); return null; }
  if(rows && rows.length) return rows[0];

  // Primera vez: sembramos la version con lo que trae el HTML
  const semilla = JSON.parse(JSON.stringify(currentData));
  const {data:nueva, error:e2} = await supa.from('cierre_versiones').insert({
    dashboard_id: DASHBOARD_ID,
    version_label: currentData.criterioCorte || 'Version inicial',
    fecha_corte:   currentData.fechaCorte || new Date().toISOString().slice(0,10),
    uploaded_by:   userSession?.user?.email || 'admin',
    data:          semilla,
    nota:          'Siembra automatica desde el HTML publicado'
  }).select('id,data').limit(1);
  if(e2){ console.warn(e2); return null; }
  await cargarCortes();
  return nueva && nueva[0] ? nueva[0] : null;
}

async function bitacora(pagina, tipo, key, antes, despues, escenario, motivo){
  if(!supa || !isAdmin) return;
  try{
    await supa.from('ediciones').insert({
      editado_por: userSession?.user?.email || 'admin',
      pagina, campo_tipo: tipo, campo_key: key,
      escenario: escenario || null,
      valor_antes: antes==null?null:String(antes),
      valor_despues: despues==null?null:String(despues),
      motivo: motivo || null
    });
  }catch(e){ console.warn('bitacora:',e); }
}

/* ===== PALANCAS ===== */
const PAL_DEFAULT = JSON.parse(JSON.stringify(
  (typeof EMBEDDED_DATA !== 'undefined' && EMBEDDED_DATA.palancas) || {}));

function fmtMonto(v){
  return '$' + Math.round(v||0).toLocaleString('es-MX');
}

function pintarPalancas(){
  const P = currentData.palancas; if(!P) return;
  // Tierra
  document.getElementById('pal-t-cap')?.classList.toggle('on', P.tierra==='capital');
  document.getElementById('pal-t-gas')?.classList.toggle('on', P.tierra==='gasto');
  // Contratos por cerrar (CPC)
  ['e1','e2'].forEach(f =>
    document.getElementById('pal-cpc-'+f)?.classList.toggle('on', P.cpcEtapa===f));
  const cpcInp = document.getElementById('pal-cpc-monto');
  if(cpcInp && document.activeElement !== cpcInp) cpcInp.value = fmtMonto(P.cpcMonto||0);

  // Sello del criterio activo
  const FASE = {e1:'Etapa 1', e2:'Etapa 2'};
  const sello = document.getElementById('sello-criterio');
  if(sello){
    sello.innerHTML = `Tierra: <b>${P.tierra==='capital'?'aportada':'gasto'}</b>`
                    + ` &nbsp;&middot;&nbsp; Contratos por cerrar <b>${fmtMonto(P.cpcMonto||0)}</b> en <b>${FASE[P.cpcEtapa]||'E2'}</b>`;
  }

  // Aviso si la configuracion no es la guardada
  const cambiado = JSON.stringify(P) !== JSON.stringify(PAL_DEFAULT);
  const av = document.getElementById('pal-aviso');
  if(av){
    av.classList.toggle('on', cambiado);
    const t = document.getElementById('pal-aviso-txt');
    if(t) t.textContent = 'Configuracion modificada. No es la guardada como default.';
  }
  const g = document.getElementById('pal-guardar');
  if(g) g.style.display = (isAdmin && cambiado) ? 'inline-block' : 'none';
}

function aplicarPalancas(){
  recalculate('e1'); recalculate('e2'); recalculate('cons');
  validarConsolidado();
  pintarPalancas();
  renderAll();
}

function setTierra(modo){
  currentData.palancas.tierra = modo;
  aplicarPalancas();
}

function resetPalancas(){
  currentData.palancas = JSON.parse(JSON.stringify(PAL_DEFAULT));
  aplicarPalancas();
}

function setCpcMonto(v){
  const num = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  if(isNaN(num)) { pintarPalancas(); return; }
  currentData.palancas.cpcMonto = num;
  aplicarPalancas();
}

function setCpcEtapa(etapa){
  currentData.palancas.cpcEtapa = etapa;
  aplicarPalancas();
}

/* Cambiar el criterio de tierra cambia el consolidado — eso es el punto de la
   palanca. Mover CPC entre etapas no. La referencia se guarda por criterio. */
const _consRef = {};
function refKey(){
  const P = currentData.palancas || {};
  return `${P.tierra}|${P.cpcMonto||0}`;
}
function validarConsolidado(){
  const el = document.getElementById('valida-cons');
  if(!el || !currentData.cons?.data?.utilidadNeta) return;
  const k = refKey();
  const actual = currentData.cons.data.utilidadNeta[0];
  if(_consRef[k] === undefined){ _consRef[k] = actual; el.classList.remove('on'); return; }
  const dif = Math.abs(actual - _consRef[k]);
  if(dif > 1){
    el.classList.add('on');
    el.textContent = `Alerta de consistencia: el consolidado se movio ${fmtMonto(dif)} `
      + `al reasignar contratos por cerrar entre etapas. Revisar la cascada.`;
  } else {
    el.classList.remove('on');
  }
}
function fijarRefConsolidado(){
  const v = currentData.cons?.data?.utilidadNeta?.[0];
  if(v !== undefined) _consRef[refKey()] = v;
}

async function guardarPalancas(){
  if(!supa || !isAdmin) return;
  const ver = await obtenerOCrearVersion();
  if(!ver){ alert('No se pudo acceder a la version. Revisa tu sesion.'); return; }
  const P = currentData.palancas;
  const nd = {...ver.data, palancas: P};
  const {error} = await supa.from('cierre_versiones').update({data:nd}).eq('id',ver.id);
  if(error){ alert('No se pudo guardar: '+error.message); return; }
  // Persistir tambien en palancas_default (tabla nueva)
  try{
    await supa.from('palancas_default').upsert({
      dashboard_id: DASHBOARD_ID,
      tierra: P.tierra,
      contratos_monto: P.cpcMonto || 0,
      contratos_etapa: P.cpcEtapa || 'e2',
      updated_by: userSession?.user?.id || null
    }, {onConflict: 'dashboard_id'});
  }catch(e){ console.warn('palancas_default:', e); }
  await bitacora('palancas','configuracion','palancas',
                 JSON.stringify(PAL_DEFAULT), JSON.stringify(P),
                 null, 'Cambio de default de supuestos');
  Object.assign(PAL_DEFAULT, JSON.parse(JSON.stringify(P)));
  pintarPalancas();
  alert('Configuracion guardada como default.');
}

/* El ancla siempre es costoObra del ultimo escenario de E1 (construccion pura, sin CPC) */
function getAnclaBreakdown(){
  if(!currentData.e1?.data?.costoObra) return BREAKDOWN_DEFAULT.hc.pres;
  const arr = currentData.e1.data.costoObra;
  return arr[arr.length - 1] || BREAKDOWN_DEFAULT.hc.pres;
}

function getBreakdownData(){
  return currentData.breakdown || BREAKDOWN_DEFAULT;
}

function calcBreakdown(bd){
  const ancla = getAnclaBreakdown();
  const presIni = bd.presIni || BREAKDOWN_DEFAULT.presIni;
  const partidas = bd.partidas || [];
  const sumaPartidas = partidas.reduce((s,p) => s + (p.monto||0), 0);
  const brecha = ancla - presIni - sumaPartidas;
  return {ancla, presIni, partidas, sumaPartidas, brecha};
}

function buildBreakdownHtml(bd){
  const {ancla, presIni, partidas, sumaPartidas, brecha} = calcBreakdown(bd);

  /* Semaforo */
  const abs = Math.abs(brecha);
  let semClass, semLabel;
  if(abs < 1){
    semClass='verde'; semLabel='Conciliado';
  } else if(brecha > 0){
    semClass='ambar'; semLabel='Falta explicar';
  } else {
    semClass='rojo'; semLabel='Excede por';
  }

  /* HC / SC bars */
  const hc = bd.hc || BREAKDOWN_DEFAULT.hc;
  const sc = bd.sc || BREAKDOWN_DEFAULT.sc;
  const hcPct = hc.pres ? (hc.ejer / hc.pres * 100) : 0;
  const scPct = sc.pres ? (sc.ejer / sc.pres * 100) : 0;

  let html = `
  <div class="card">
    <div class="bkd-header">
      <div class="bkd-header-left">
        <h2 class="bkd-title">Detalle de Evolucion Presupuestal — Etapa 1</h2>
        <p class="bkd-subtitle">Corte: ${bd.fecha || 'sin fecha'} &nbsp;&middot;&nbsp; Ancla: Costo Obra E1 del escenario activo</p>
      </div>
      <div class="bkd-semaforo ${semClass}">
        <span class="bkd-sem-label">${semLabel}</span>
        <span class="bkd-sem-value">${abs < 1 ? '$0' : fmtCur(abs)}</span>
      </div>
    </div>

    <div class="bkd-reconciliacion">
      <div class="bkd-rec-tile ancla">
        <p class="bkd-rec-label">Ancla (Costo Obra E1)</p>
        <p class="bkd-rec-value">${fmtCur(ancla)}</p>
      </div>
      <div class="bkd-rec-tile">
        <p class="bkd-rec-label">Presupuesto inicial</p>
        <p class="bkd-rec-value">${fmtCur(presIni)}</p>
      </div>
      <div class="bkd-rec-tile">
        <p class="bkd-rec-label">Variacion explicada</p>
        <p class="bkd-rec-value">${fmtCur(sumaPartidas)}</p>
      </div>
    </div>

    <div class="bkd-bars">
      <div class="bkd-bar-row">
        <div class="bkd-bar-label"><span>Hard Cost</span><span class="pct">${fmtCur(hc.ejer)} de ${fmtCur(hc.pres)} (${hcPct.toFixed(1)}%)</span></div>
        <div class="bkd-bar-track"><div class="bkd-bar-fill hc" style="width:${Math.min(hcPct,100).toFixed(1)}%"></div></div>
      </div>
      <div class="bkd-bar-row">
        <div class="bkd-bar-label"><span>Soft Cost</span><span class="pct">${fmtCur(sc.ejer)} de ${fmtCur(sc.pres)} (${scPct.toFixed(1)}%)</span></div>
        <div class="bkd-bar-track"><div class="bkd-bar-fill sc" style="width:${Math.min(scPct,100).toFixed(1)}%"></div></div>
      </div>
    </div>

    <div class="bkd-tbl-wrap">
      <table class="bkd-data">
        <thead><tr>
          <th>Concepto</th>
          <th>Monto</th>
          <th>Saldo acumulado</th>
          <th></th>
        </tr></thead>
        <tbody>
          <tr class="bkd-total"><td>Presupuesto inicial</td><td>${fmtCur(presIni)}</td><td>${fmtCur(ancla - presIni)}</td><td></td></tr>`;

  /* Partidas — saldo descendente desde la variacion total */
  let saldo = ancla - presIni;
  for(const p of partidas){
    saldo -= (p.monto||0);
    const canEdit = isAdmin && !enHistorico;
    /* Nombre editable si es admin */
    const nameHtml = canEdit
      ? `<span contenteditable="true" style="cursor:text;outline:none;border-bottom:1px dashed var(--border)" onblur="saveBkdName('${p.key}',this.textContent.trim())">${p.name}</span>`
      : p.name;
    const aliahTag = p.group==='aliah'?' <span style="font-size:10px;color:var(--muted)">(ALIAH)</span>':'';
    /* Monto editable si es admin */
    const montoHtml = canEdit
      ? `<span contenteditable="true" style="cursor:text;outline:none;color:var(--error);border-bottom:1px dashed var(--border)" data-bkd-monto="${p.key}" onblur="saveBkdMonto('${p.key}',this.textContent.trim())">-${fmtCur(p.monto||0)}</span>`
      : `-${fmtCur(p.monto||0)}`;
    /* Detalle colapsable inline en lugar de modal */
    const hasDetail = p.detail && p.detail.items && p.detail.items.length;
    const toggleId = 'bkd-det-'+p.key;
    const toggleBtn = hasDetail
      ? `<span style="cursor:pointer;color:var(--brass-dark);font-size:11px;font-weight:600" onclick="document.getElementById('${toggleId}').style.display=document.getElementById('${toggleId}').style.display==='none'?'block':'none'">&#9662; detalle</span>`
      : '';
    html += `<tr><td>${nameHtml}${aliahTag}</td>
      <td>${montoHtml}</td>
      <td>${fmtCur(saldo)}</td>
      <td>${toggleBtn}</td></tr>`;
    if(hasDetail){
      let detHtml = `<div style="font-size:11px;color:var(--muted);padding:4px 0">`;
      detHtml += `<div style="font-size:10px;color:var(--brass-dark);margin-bottom:4px">Fuente: ${p.detail.source||'sin especificar'}</div>`;
      for(const it of p.detail.items){
        detHtml += `<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted var(--border)"><span>${it.name}</span><span style="font-weight:600">${fmtCur(it.monto||0)}</span></div>`;
      }
      detHtml += `</div>`;
      html += `<tr id="${toggleId}" style="display:none"><td colspan="4" style="padding:4px 20px 8px;background:rgba(164,172,140,.04);border-left:2px solid var(--border)">${detHtml}</td></tr>`;
    }
  }

  /* Fila de brecha */
  html += `<tr class="bkd-brecha"><td>Brecha sin explicar</td><td>${fmtCur(brecha)}</td><td></td><td></td></tr>`;

  html += `</tbody></table></div>`;

  /* Boton para agregar partida (solo admin) */
  if(isAdmin && !enHistorico){
    html += `<button class="add-partida" onclick="addBreakdownPartida()" style="margin-top:14px">+ Agregar concepto</button>`;
  }

  html += `</div>`;
  return html;
}

function showBkdDetail(key){
  const bd = getBreakdownData();
  const p = (bd.partidas||[]).find(x=>x.key===key);
  if(!p || !p.detail) return;

  const overlay = document.createElement('div');
  overlay.className = 'bkd-modal-overlay';
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };

  let tbl = '';
  if(p.detail.items && p.detail.items.length){
    tbl = '<table class="bkd-data" style="margin-top:12px"><thead><tr><th>Subconcepto</th><th>Monto</th></tr></thead><tbody>';
    let sum = 0;
    for(const it of p.detail.items){
      sum += (it.monto||0);
      tbl += `<tr><td>${it.name}</td><td>${fmtCur(it.monto||0)}</td></tr>`;
    }
    tbl += `<tr class="bkd-total"><td>Total</td><td>${fmtCur(sum)}</td></tr></tbody></table>`;
  }

  overlay.innerHTML = `<div class="bkd-detail-modal" style="position:relative;">
    <button class="bkd-det-close" onclick="this.closest('.bkd-modal-overlay').remove()">&#10005;</button>
    <h3>${p.name}</h3>
    <p class="bkd-det-source">Fuente: ${p.detail.source||'sin especificar'}</p>
    ${tbl}
  </div>`;
  document.body.appendChild(overlay);
}

async function addBreakdownPartida(){
  const name = prompt('Nombre del concepto:');
  if(!name) return;
  const montoStr = prompt('Monto (sin signo, en pesos):');
  if(!montoStr) return;
  const monto = parseFloat(montoStr.replace(/[,$\s]/g,''));
  if(isNaN(monto) || monto <= 0){ alert('Monto invalido'); return; }

  const bd = getBreakdownData();
  if(!bd.partidas) bd.partidas = [];
  const key = 'bkd_' + Date.now();
  bd.partidas.push({key, name: name.trim(), monto, detail:null});
  currentData.breakdown = bd;

  await guardarBreakdown('Alta de concepto: ' + name.trim());
  renderBreakdown();
}

async function saveBkdName(key, newName){
  if(!newName || !puedeEditar()) return;
  const bd = getBreakdownData();
  const p = (bd.partidas||[]).find(x=>x.key===key);
  if(!p || p.name===newName) return;
  p.name = newName;
  currentData.breakdown = bd;
  await guardarBreakdown('Renombrar concepto: '+newName);
}

async function saveBkdMonto(key, raw){
  if(!puedeEditar()) return;
  const num = parseFloat(String(raw).replace(/[^0-9.\-]/g,''));
  if(isNaN(num)) return;
  const monto = Math.abs(num);
  const bd = getBreakdownData();
  const p = (bd.partidas||[]).find(x=>x.key===key);
  if(!p || p.monto===monto) return;
  p.monto = monto;
  currentData.breakdown = bd;
  await guardarBreakdown('Editar monto '+p.name+': '+monto);
  renderBreakdown();
}

  const bd = getBreakdownData();
  const antes = JSON.stringify(currentData._breakdownPrev || null);

/* ---------- PARSER MEGASEMBRADO (SheetJS browser) ---------- */
function parseMegasembrado(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject('Error leyendo el archivo');
    reader.onload = e => {
      try {
        const XL = window.XLSX; if(!XL){ reject('SheetJS no disponible'); return; }
        const wb = XL.read(e.target.result, {type:'array', cellDates:true});
        const ws = wb.Sheets['MEGASEMBRADO'];
        if(!ws){ reject('Hoja "MEGASEMBRADO" no encontrada. Hojas disponibles: '+wb.SheetNames.slice(0,10).join(', ')); return; }

        const raw = XL.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
        if(raw.length < 10){ reject('Hoja MEGASEMBRADO con menos de 10 filas'); return; }

        /* Detectar fila de headers: buscar "TORRE" o "Torre" */
        let hdrIdx = -1;
        for(let i=0; i<Math.min(15,raw.length); i++){
          const row = raw[i];
          if(!row) continue;
          const joined = row.map(c=>String(c||'').toUpperCase()).join('|');
          if(joined.includes('TORRE') && (joined.includes('DEPTO') || joined.includes('DEPARTAMENTO'))){
            hdrIdx = i; break;
          }
        }
        if(hdrIdx<0){ reject('No se encontro fila de headers con TORRE/DEPTO en MEGASEMBRADO'); return; }

        const hdrs = raw[hdrIdx].map(h=>String(h||'').trim().toUpperCase());

        /* Map column indices */
        function findCol(...variants){
          for(const v of variants){
            const idx = hdrs.findIndex(h=>h.includes(v.toUpperCase()));
            if(idx>=0) return idx;
          }
          return -1;
        }

        const colTorre     = findCol('TORRE');
        const colDepto     = findCol('DEPTO','DEPARTAMENTO');
        const colProto     = findCol('PROTOTIPO');
        const colMetros    = findCol('METROS','M2','M²');
        const colStatus    = findCol('STATUS VENTA','STATUS_VENTA','ESTATUS VENTA');
        const colValor     = findCol('VALOR TOTAL');
        const colValorM2   = findCol('VALOR M2','VALOR_M2','$/M2');
        const colPropie    = findCol('NOMBRE_PROPIETARIO','PROPIETARIO','NOMBRE PROPIETARIO');
        const colFirma     = findCol('FIRMA','FIRMA CONTRATO');
        const colDeposito  = findCol('DEPOSITO','DEPOSITO M1');
        const colPagoIni   = findCol('PAGO INICIAL');
        const colDiferido  = findCol('PAGO DIFERIDO');
        const colSaldoDif  = findCol('SALDO DIFERIDO');
        const colAportado  = findCol('TOTAL APORTADO','TOTAL_APORTADO');
        const colFechaIni  = findCol('FECHA INICIO','INICIO PAGOS');
        const colFechaLiq  = findCol('FECHA DE LIQ','FECHA LIQ REAL');
        const colFechaExp  = findCol('FORMULA FIN MES','FIN MES EXPEC','FIN MES EXP');

        /* Detectar columnas de meses (flujos) — buscan AGO-2026, SEP-2026, etc */
        const monthCols = [];
        for(let c=0; c<hdrs.length; c++){
          const h = hdrs[c];
          const m = h.match(/(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)[- ]?(\d{4})/);
          if(m){
            const mesMap = {ENE:0,FEB:1,MAR:2,ABR:3,MAY:4,JUN:5,JUL:6,AGO:7,SEP:8,OCT:9,NOV:10,DIC:11};
            monthCols.push({col:c, mes:mesMap[m[1]], anio:parseInt(m[2]), label:m[1]+'-'+m[2]});
          }
        }

        const gn = (row,c) => { if(c<0) return 0; const v=row[c]; if(v==null||v==='') return 0; if(typeof v==='number') return v; const n=parseFloat(String(v).replace(/[$,%\s,]/g,'')); return isNaN(n)?0:n; };
        const gs = (row,c) => c<0?'':String(row[c]||'').trim();

        const unidades = [];
        for(let i=hdrIdx+1; i<raw.length; i++){
          const r = raw[i];
          if(!r) continue;
          const torre = gs(r,colTorre);
          if(!torre || torre.length>5) continue; /* filter junk rows */
          const depto = gs(r,colDepto);
          if(!depto) continue;

          const statusRaw = gs(r,colStatus).toUpperCase();
          let status = 'DISPONIBLE';
          if(statusRaw.includes('VENDID') || statusRaw.includes('ESCRITUR') || statusRaw.includes('FIRMAD')) status='VENDIDO';
          else if(statusRaw.includes('APARTAD') || statusRaw.includes('SEPARAD') || statusRaw.includes('RESERV')) status='APARTADO';
          else if(statusRaw.includes('CANCEL')) status='CANCELADO';
          else if(statusRaw.includes('DISPONIB') || statusRaw==='') status='DISPONIBLE';
          else status = statusRaw || 'DISPONIBLE';

          const u = {
            torre, depto,
            prototipo: gs(r,colProto),
            metros: gn(r,colMetros),
            status,
            valorTotal: gn(r,colValor),
            valorM2: gn(r,colValorM2),
            propietario: gs(r,colPropie),
            firma: gs(r,colFirma),
            deposito: gn(r,colDeposito),
            pagoInicial: gn(r,colPagoIni),
            pagoDiferido: gn(r,colDiferido),
            saldoDiferido: gn(r,colSaldoDif),
            totalAportado: gn(r,colAportado),
            fechaLiqReal: colFechaLiq>=0 ? r[colFechaLiq] : null,
            fechaLiqExpec: colFechaExp>=0 ? r[colFechaExp] : null,
            flujos: {}
          };

          /* flujos mensuales */
          for(const mc of monthCols){
            const val = gn(r, mc.col);
            if(val !== 0) u.flujos[mc.label] = val;
          }

          unidades.push(u);
        }

        if(!unidades.length){ reject('No se encontraron unidades en MEGASEMBRADO'); return; }

        resolve({
          unidades,
          monthCols: monthCols.map(m=>m.label),
          fechaParseo: new Date().toISOString(),
          archivoHojas: wb.SheetNames.length
        });
      } catch(ex){ reject(ex.message||String(ex)); }
    };
    reader.readAsArrayBuffer(file);
  });
}

/* ---------- COMPUTAR VISTAS DESDE UNIDADES PARSEADAS ---------- */
function computeAbsorcionViews(absData){
  const u = absData.unidades || [];
  const monthLabels = absData.monthCols || [];

  /* --- 1. ESTADO DE ABSORCION por torre/fase --- */
  const torreMap = {};
  u.forEach(unit => {
    const t = unit.torre.toUpperCase().replace(/[^A-Z]/g,'');
    if(!torreMap[t]) torreMap[t] = {torre:t, total:0, vendidos:0, apartados:0, disponibles:0, cancelados:0, valorTotal:0, valorVendido:0, metros:0};
    torreMap[t].total++;
    torreMap[t].metros += unit.metros||0;
    torreMap[t].valorTotal += unit.valorTotal||0;
    if(unit.status==='VENDIDO'){ torreMap[t].vendidos++; torreMap[t].valorVendido += unit.valorTotal||0; }
    else if(unit.status==='APARTADO') torreMap[t].apartados++;
    else if(unit.status==='CANCELADO') torreMap[t].cancelados++;
    else torreMap[t].disponibles++;
  });

  const torres = Object.values(torreMap).sort((a,b)=>a.torre.localeCompare(b.torre));

  /* Fase grouping */
  const fases = [{fase:1,torres:[],total:0,vendidos:0,apartados:0,disponibles:0,valorTotal:0,valorVendido:0},
                 {fase:2,torres:[],total:0,vendidos:0,apartados:0,disponibles:0,valorTotal:0,valorVendido:0}];
  torres.forEach(t => {
    const f = ABS_TORRES_FASE[t.torre]?.fase || (t.torre<='C'?1:2);
    const idx = f===1?0:1;
    fases[idx].torres.push(t.torre);
    fases[idx].total += t.total;
    fases[idx].vendidos += t.vendidos;
    fases[idx].apartados += t.apartados;
    fases[idx].disponibles += t.disponibles;
    fases[idx].valorTotal += t.valorTotal;
    fases[idx].valorVendido += t.valorVendido;
  });

  /* --- 2. ABSORCION LOGRADA Y POR LOGRAR --- */
  const fasesLogrado = fases.map(f => {
    const cobrado = u.filter(x=> fases[f.fase===1?0:1].torres.includes(x.torre.toUpperCase().replace(/[^A-Z]/g,'')) && x.status==='VENDIDO')
      .reduce((s,x)=>s+(x.totalAportado||0),0);
    const porCobrarTiempo = u.filter(x=> fases[f.fase===1?0:1].torres.includes(x.torre.toUpperCase().replace(/[^A-Z]/g,'')) && x.status==='VENDIDO')
      .reduce((s,x)=>s+Math.max(0,(x.valorTotal||0)-(x.totalAportado||0)-(x.saldoDiferido||0)),0);
    const vencido = u.filter(x=> fases[f.fase===1?0:1].torres.includes(x.torre.toUpperCase().replace(/[^A-Z]/g,'')) && x.status==='VENDIDO')
      .reduce((s,x)=>s+(x.saldoDiferido||0),0);
    /* Correccion: Valor de liberacion Fase 2 + $125,000,000.02 */
    let valorLib = f.valorTotal;
    if(f.fase===2) valorLib += 125000000.02;
    const porLograr = valorLib - f.valorVendido;
    return { fase:f.fase, valorTotal:valorLib, logrado:f.valorVendido, porLograr, cobrado, porCobrarTiempo, vencido };
  });

  /* --- 3. FLUJOS ESPERADOS POR MES --- */
  const flujosPorMes = {};
  monthLabels.forEach(ml => { flujosPorMes[ml] = 0; });
  u.forEach(unit => {
    for(const [ml,val] of Object.entries(unit.flujos||{})){
      flujosPorMes[ml] = (flujosPorMes[ml]||0) + val;
    }
  });

  /* Flujos por fase y mes */
  const flujosFase = [{fase:1, meses:{}},{fase:2, meses:{}}];
  monthLabels.forEach(ml => { flujosFase[0].meses[ml]=0; flujosFase[1].meses[ml]=0; });
  u.forEach(unit => {
    const t = unit.torre.toUpperCase().replace(/[^A-Z]/g,'');
    const fIdx = (ABS_TORRES_FASE[t]?.fase||1)===1?0:1;
    for(const [ml,val] of Object.entries(unit.flujos||{})){
      flujosFase[fIdx].meses[ml] = (flujosFase[fIdx].meses[ml]||0) + val;
    }
  });

  return {
    torres, fases, fasesLogrado, flujosPorMes, flujosFase, monthLabels,
    totalUnidades: u.length,
    totalVendidos: u.filter(x=>x.status==='VENDIDO').length,
    totalApartados: u.filter(x=>x.status==='APARTADO').length,
    totalDisponibles: u.filter(x=>x.status==='DISPONIBLE').length
  };
}

  const totalValor = views.fases.reduce((s,f)=>s+f.valorTotal,0);
  const totalVendido = views.fases.reduce((s,f)=>s+f.valorVendido,0);

  let html = `
  <div class="abs-tab-nav">

    <div class="stat-tile"><p class="stat-label">Apartadas</p><p class="stat-value" style="color:var(--brass-dark)">${views.totalApartados}</p></div>
    <div class="stat-tile"><p class="stat-label">Disponibles</p><p class="stat-value" style="color:var(--muted)">${views.totalDisponibles}</p></div>
  </div>`;

  /* Absorcion bar per phase */
  html += `<div class="abs-sub-grid">`;
  views.fases.forEach(f => {
    const pctVend = f.total?f.vendidos/f.total*100:0;
    const pctApart = f.total?f.apartados/f.total*100:0;
    html += `<div class="card">
      <p class="card-title">Fase ${f.fase} — Torres ${f.torres.join(', ')}</p>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <span style="font-size:13px;font-weight:600">${f.vendidos} vendidos de ${f.total}</span>

    for(const a of alertas.slice(0,100)){

        <td style="padding:4px 8px;text-align:right">${actionBtn}</td>
      </tr>`;
    }
    if(alertas.length>100) html += `<tr><td colspan="4" style="padding:6px 8px;color:var(--muted)">...y ${alertas.length-100} mas</td></tr>`;
    html += `</tbody></table></div></div>`;
  }

  /* Fecha de parseo */
  if(absData.fechaParseo){
    const flujosTag = absData.flujosGenerados ? ' &middot; Flujos proyectados' : '';
    const mergeTag = absData.mergeStats ? ` &middot; Cruce: ${absData.mergeStats.matched} OK` : '';

  }

  return html;
}

/* ---------- FIX INLINE: corregir precio de unidad ---------- */
async function fixAbsPrice(clave, nuevoValor){
  if(!currentData.absorcion || !puedeEditar()) return;
  const u = currentData.absorcion.unidades.find(x=>
    (x.torre+'-'+x.depto).toUpperCase().replace(/\s/g,'') === clave);
  if(!u) return;
  u.valorTotal = nuevoValor;
  u._alerta = null;
  /* Quitar de alertas */
  if(currentData.absorcion.alertas){
    currentData.absorcion.alertas = currentData.absorcion.alertas.filter(a=>a.clave!==clave);
    if(currentData.absorcion.mergeStats) currentData.absorcion.mergeStats.priceDiffs = Math.max(0,(currentData.absorcion.mergeStats.priceDiffs||1)-1);
  }
  await guardarAbsorcion('Correccion precio '+clave+' a '+nuevoValor);
  renderAbsorcion();
}

/* ---------- PARSER LISTA DE PRECIOS ---------- */
function parseListaPrecios(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject('Error leyendo el archivo de precios');
    reader.onload = e => {
      try {
        const XL = window.XLSX; if(!XL){ reject('SheetJS no disponible'); return; }
        const wb = XL.read(e.target.result, {type:'array', cellDates:true});
        /* Buscar hoja con "CONTROL" o "PRECIOS" o la primera */
        let wsName = wb.SheetNames.find(n=>n.toUpperCase().includes('CONTROL') || n.toUpperCase().includes('PRECIO'));
        if(!wsName) wsName = wb.SheetNames[0];
        const ws = wb.Sheets[wsName];
        if(!ws){ reject('No se encontro hoja de precios'); return; }

        const raw = XL.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});

        /* Detectar header row — buscar "UNIDAD CRUCE" o "TORRE" */
        let hdrIdx = -1;
        for(let i=0; i<Math.min(15,raw.length); i++){
          const row = raw[i];
          if(!row) continue;
          const joined = row.map(c=>String(c||'').toUpperCase()).join('|');
          if(joined.includes('TORRE') && (joined.includes('UNIDAD') || joined.includes('CRUCE'))){
            hdrIdx = i; break;
          }
        }
        if(hdrIdx<0){ reject('No se encontro fila de headers con TORRE/UNIDAD CRUCE en la hoja de precios'); return; }

        const hdrs = raw[hdrIdx].map(h=>String(h||'').trim().toUpperCase());

        function findCol(...variants){
          for(const v of variants){
            const idx = hdrs.findIndex(h=>h.includes(v.toUpperCase()));
            if(idx>=0) return idx;
          }
          return -1;
        }

        const colTorre     = findCol('TORRE');
        const colClave     = findCol('UNIDAD CRUCE','UNIDAD_CRUCE','CLAVE CRUCE');
        const colStatus    = findCol('ESTATUS','STATUS');
        const colTipo      = findCol('TIPO');
        const colAreaInt   = findCol('AREA INTERIOR','INTERIOR M2');
        const colM2Tot     = findCol('M2 TOTALES','TOTALES');
        const colUbicacion = findCol('UBICACION','UBICACIÓN');

        /* Encontrar la columna de precio mas reciente (mayor fecha) */
        let maxPriceCol = -1, maxPriceLabel = '';
        for(let c=0; c<hdrs.length; c++){
          if(hdrs[c].includes('PRECIO DE LISTA') || hdrs[c].includes('LISTA DE PRECIO')){
            maxPriceCol = c; maxPriceLabel = hdrs[c];
          }
        }

        /* Valor m2 ponderado junto al ultimo precio */
        const colValM2Pond = (maxPriceCol>=0 && maxPriceCol+2<hdrs.length && hdrs[maxPriceCol+2].includes('PONDERADO'))
          ? maxPriceCol+2 : findCol('VALOR M2 PONDERADO');

        const gn = (row,c) => { if(c<0) return 0; const v=row[c]; if(v==null||v==='') return 0; if(typeof v==='number') return v; const n=parseFloat(String(v).replace(/[$,%\s,]/g,'')); return isNaN(n)?0:n; };
        const gs = (row,c) => c<0?'':String(row[c]||'').trim();

        const items = {};
        for(let i=hdrIdx+1; i<raw.length; i++){
          const r = raw[i];
          if(!r) continue;
          const clave = gs(r, colClave);
          if(!clave || clave.length<3) continue;
          items[clave.toUpperCase()] = {
            clave,
            torre:     gs(r,colTorre),
            status:    gs(r,colStatus),
            tipo:      gs(r,colTipo),
            areaInt:   gn(r,colAreaInt),
            m2Tot:     gn(r,colM2Tot),
            ubicacion: gs(r,colUbicacion),
            precioLista: gn(r, maxPriceCol),
            valorM2Pond: gn(r, colValM2Pond),
            precioLabel: maxPriceLabel
          };
        }

        resolve({items, count:Object.keys(items).length, precioLabel:maxPriceLabel, hoja:wsName});
      } catch(ex){ reject(ex.message||String(ex)); }
    };
    reader.readAsArrayBuffer(file);
  });
}

/* ---------- MERGE MEGASEMBRADO + LISTA PRECIOS ---------- */
function mergeAbsorcionConPrecios(absData, preciosData){
  const alertas = [];
  const precioMap = preciosData.items;
  let matched = 0, soloMega = 0, soloPrecios = 0, priceDiffs = 0;

  for(const u of absData.unidades){
    /* Construir clave compatible: TORRE-DEPTO */
    const claveUpper = (u.torre + '-' + u.depto).toUpperCase().replace(/\s/g,'');
    const precio = precioMap[claveUpper];
    if(precio){
      matched++;
      u.precioLista = precio.precioLista;
      u.valorM2Pond = precio.valorM2Pond;
      u.areaInt = precio.areaInt || u.metros;
      u.m2Tot = precio.m2Tot || u.metros;
      u.tipoPrecio = precio.tipo;
      u.statusPrecio = precio.status;
      /* Detectar inconsistencias */
      if(u.valorTotal && precio.precioLista && Math.abs(u.valorTotal - precio.precioLista) > 1000){
        const diff = u.valorTotal - precio.precioLista;
        const pct = (diff / precio.precioLista * 100).toFixed(1);
        u._alerta = `Valor MEGA (${fmtCur(u.valorTotal)}) vs Lista (${fmtCur(precio.precioLista)}): dif ${pct}%`;
        alertas.push({clave:claveUpper, tipo:'precio_diff', msg:u._alerta, valorMega:u.valorTotal, valorLista:precio.precioLista, diff});
        priceDiffs++;
      }
    } else {
      soloMega++;
      u._alerta = 'No encontrada en Lista de Precios';
      alertas.push({clave:claveUpper, tipo:'solo_mega', msg:'Unidad en MEGASEMBRADO pero no en Lista de Precios'});
    }
  }

  /* Unidades en precios pero no en MEGA */
  const megaClaves = new Set(absData.unidades.map(u=>(u.torre+'-'+u.depto).toUpperCase().replace(/\s/g,'')));
  for(const [clave, p] of Object.entries(precioMap)){
    if(!megaClaves.has(clave)){
      soloPrecios++;
      alertas.push({clave, tipo:'solo_precios', msg:'Unidad en Lista de Precios pero no en MEGASEMBRADO', status:p.status});
    }
  }

  absData.mergeStats = {matched, soloMega, soloPrecios, priceDiffs, totalAlertas:alertas.length};
  absData.alertas = alertas;
  absData.precioLabel = preciosData.precioLabel;
  return absData;
}

/* ---------- GENERAR FLUJOS SINTETICOS ---------- */
function generarFlujosLiquidacion(absData){
  /* Usa la columna BM "Formula Fin mes Expec / firma" del MEGASEMBRADO
     para colocar el saldo pendiente de cada unidad vendida en el mes
     de liquidacion esperada a escritura. */
  const MES_LABEL = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

  function parseDateToLabel(val){
    /* SheetJS con cellDates:true puede dar Date, string DD/MM/YYYY o serial */
    if(!val) return null;
    let d;
    if(val instanceof Date){ d = val; }
    else if(typeof val === 'string'){
      const parts = val.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if(!parts) return null;
      d = new Date(parseInt(parts[3]), parseInt(parts[2])-1, parseInt(parts[1]));
    } else if(typeof val === 'number'){
      /* Excel serial date */
      d = new Date((val - 25569) * 86400000);
    } else return null;
    if(isNaN(d.getTime())) return null;
    return { label: MES_LABEL[d.getMonth()]+'-'+d.getFullYear(), date: d };
  }

  let sinFecha = 0, conFecha = 0, yaLiquidados = 0;
  const hoy = new Date();

  for(const u of absData.unidades){
    if(u.status!=='VENDIDO') continue;

    /* Saldo pendiente a liquidacion = valorTotal - totalAportado */
    const pendiente = Math.max(0, (u.valorTotal||0) - (u.totalAportado||0));
    if(pendiente < 100) { yaLiquidados++; continue; }

    /* Usar fechaLiqExpec (BM) como fecha de liquidacion a escritura */
    const parsed = parseDateToLabel(u.fechaLiqExpec) || parseDateToLabel(u.fechaLiqReal);
    if(!parsed){ sinFecha++; continue; }

    conFecha++;
    u.fechaLiqMes = parsed.label;

    /* Colocar el pendiente completo en ese mes */
    if(!u.flujos) u.flujos = {};
    u.flujos[parsed.label] = (u.flujos[parsed.label]||0) + pendiente;
  }

  /* Actualizar monthCols con todas las fechas de liquidacion */
  const allMonths = new Set(absData.monthCols||[]);
  absData.unidades.forEach(u => {
    if(u.fechaLiqMes) allMonths.add(u.fechaLiqMes);
    Object.keys(u.flujos||{}).forEach(ml => allMonths.add(ml));
  });

  /* Ordenar cronologicamente */
  const mesMap = {ENE:0,FEB:1,MAR:2,ABR:3,MAY:4,JUN:5,JUL:6,AGO:7,SEP:8,OCT:9,NOV:10,DIC:11};
  const sorted = Array.from(allMonths).sort((a,b) => {
    const [ma,ya] = a.split('-'); const [mb,yb] = b.split('-');
    return (parseInt(ya)*12+(mesMap[ma]||0)) - (parseInt(yb)*12+(mesMap[mb]||0));
  });
  absData.monthCols = sorted;
  absData.flujosGenerados = true;
  absData.flujosStats = { conFecha, sinFecha, yaLiquidados };
  return absData;
}

function setAbsStatus(msg, type){
  const el = document.getElementById('abs-status');
  if(!el) return;
  el.style.display = 'block';
  el.className = 'status-msg ' + (type||'info');
