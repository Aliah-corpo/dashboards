<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen de Cierre — Aliah Lomas Verdes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.js"></script>
<style>
:root{
  --olive:#484D31;--green:#5F6844;--sage:#A4AC8C;
  --charcoal:#282823;--light:#F8F8F8;--white:#FFFFFF;
  --brass:#B08D57;--brass-dark:#8C6D40;--error:#9A3B3B;
  --border:#E8E6DF;--muted:#8B8B83;--radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--light);font-family:'DM Sans',sans-serif;color:var(--charcoal);-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Outfit',sans-serif;}
.wrap{max-width:1480px;margin:0 auto;padding:0 28px 80px;}

/* HEADER */
header{background:var(--charcoal);color:var(--white);padding:22px 0 18px;}
.hdr-inner{max-width:1480px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.hdr-left{display:flex;align-items:center;gap:20px;}
.brand-logo{height:44px;opacity:.92;}
.hdr-text .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);margin:0 0 4px;font-weight:500;}
.hdr-text h1{font-size:20px;margin:0;font-weight:600;display:flex;align-items:center;gap:10px;}
.rhl-badge{font-size:10px;font-weight:700;letter-spacing:.1em;background:rgba(176,141,87,.25);color:var(--brass);padding:2px 8px;border-radius:4px;vertical-align:middle;font-family:'DM Sans',sans-serif;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.ver-label{font-size:12px;color:rgba(255,255,255,.4);}
.ver-live{font-size:10px;color:var(--sage);display:none;letter-spacing:.05em;}
.admin-trigger{background:none;border:none;color:rgba(255,255,255,.15);cursor:pointer;font-size:14px;padding:2px 3px;line-height:1;transition:color .2s;margin-top:2px;}
.admin-trigger:hover{color:rgba(255,255,255,.5);}

/* GATE DE LOGIN */
#gate{position:fixed;inset:0;z-index:9000;background:var(--charcoal);
  display:flex;align-items:center;justify-content:center;padding:24px;}
#gate.oculto{display:none;}
.gate-box{background:var(--white);border-radius:18px;padding:40px 38px;width:100%;max-width:400px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);}
.gate-box img{height:46px;margin-bottom:26px;opacity:.9;}
.gate-box h2{font-size:19px;margin:0 0 6px;font-weight:600;}
.gate-box p.sub{font-size:13px;color:var(--muted);margin:0 0 24px;}
.gate-box label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
.gate-box input{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 13px;
  font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:16px;}
.gate-box input:focus{outline:none;border-color:var(--brass);}
.gate-box button{width:100%;background:var(--olive);color:#fff;border:none;border-radius:9px;
  padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
.gate-box button:hover{background:var(--green);}
.gate-err{background:rgba(154,59,59,.09);border:1px solid rgba(154,59,59,.3);color:var(--error);
  border-radius:8px;padding:10px 13px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:none;}
.gate-err.on{display:block;}

/* PALANCAS */
.palancas{background:var(--white);border:1px solid var(--border);border-left:3px solid var(--brass);
  border-radius:var(--radius);padding:16px 20px;margin:20px 0 4px;
  display:flex;flex-wrap:wrap;align-items:center;gap:26px;}
.pal-grp{display:flex;align-items:center;gap:10px;}
.pal-lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.pal-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.pal-seg button{background:var(--white);border:none;padding:6px 13px;font-size:12px;font-weight:600;
  font-family:'DM Sans',sans-serif;color:var(--muted);cursor:pointer;transition:all .14s;white-space:nowrap;}
.pal-seg button + button{border-left:1px solid var(--border);}
.pal-seg button.on{background:var(--olive);color:var(--white);}
.pal-seg button:not(.on):hover{background:var(--light);color:var(--charcoal);}
.pal-monto{width:118px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;
  font-size:12px;font-family:'DM Sans',sans-serif;text-align:right;color:var(--charcoal);}
.pal-monto:focus{outline:none;border-color:var(--brass);}
.pal-sep{width:1px;align-self:stretch;background:var(--border);}
.pal-aviso{display:none;width:100%;font-size:12px;color:var(--brass-dark);font-weight:600;
  padding-top:12px;border-top:1px dashed var(--border);align-items:center;gap:10px;}
.pal-aviso.on{display:flex;}
.pal-aviso button{background:var(--brass);color:#fff;border:none;border-radius:6px;
  padding:4px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
.pal-guardar{background:var(--olive);color:#fff;border:none;border-radius:7px;padding:6px 14px;
  font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
.pal-guardar:hover{background:var(--green);}

/* SELLO DE CRITERIO EN HEADER */
.sello{font-size:11px;color:var(--sage);letter-spacing:.02em;}
.sello b{color:var(--white);font-weight:600;}

/* PROVISION — se ve distinta porque no es cifra cerrada */
tr.provision td{font-style:italic;color:var(--muted)!important;}
.chip-est{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  background:rgba(176,141,87,.15);color:var(--brass-dark);padding:1px 7px;border-radius:9px;margin-left:8px;
  font-style:normal;vertical-align:middle;}

/* VALIDACION CONSOLIDADO */
.valida{display:none;align-items:center;gap:9px;background:rgba(154,59,59,.08);
  border:1px solid rgba(154,59,59,.35);border-radius:9px;padding:10px 15px;margin:12px 0 0;
  font-size:12.5px;color:var(--error);font-weight:600;}
.valida.on{display:flex;}

/* CORTE PICKER */
.corte-picker{display:flex;align-items:center;gap:7px;}
.corte-picker label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);}
.corte-picker input[type=date]{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:var(--white);
  border-radius:7px;padding:4px 8px;font-size:12px;font-family:'DM Sans',sans-serif;color-scheme:dark;cursor:pointer;}
.corte-picker input[type=date]:hover{border-color:rgba(255,255,255,.34);}
.corte-reset{background:none;border:none;color:var(--sage);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;}
.corte-reset:hover{color:var(--white);}
.corte-banner{display:none;align-items:center;gap:10px;background:rgba(176,141,87,.11);border:1px solid rgba(176,141,87,.4);
  border-left:3px solid var(--brass);border-radius:9px;padding:10px 16px;margin:20px 0 0;font-size:13px;color:var(--brass-dark);font-weight:500;}
.corte-banner.on{display:flex;}
.corte-banner b{color:var(--charcoal);}

/* TABS */
.tabs{display:flex;margin:28px 0 0;border-bottom:2px solid var(--border);}
.tab{padding:12px 28px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:'DM Sans',sans-serif;background:none;border-top:none;border-left:none;border-right:none;}
.tab:hover{color:var(--charcoal);}
.tab.active{color:var(--olive);border-bottom-color:var(--brass);}

/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
.card-title{font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 16px;}

/* HERO ROW */
.hero-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0 16px;}
.stat-tile{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;}
.stat-label{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:500;}
.stat-value{font-size:32px;font-weight:700;font-family:'Outfit',sans-serif;margin:0;line-height:1.1;}
.stat-value.hero{font-size:42px;}
.stat-delta{font-size:13px;margin:6px 0 0;font-weight:600;}
.stat-delta.pos{color:var(--green);}
.stat-delta.neg{color:var(--error);}
.stat-sub{font-size:12px;color:var(--muted);margin:4px 0 0;}

/* EQUITY TILES */
.equity-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 20px;}
.eq-tile{background:rgba(72,77,49,.05);border:1px solid rgba(72,77,49,.18);border-radius:var(--radius);padding:18px 20px;}
.eq-tile-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--olive);margin:0 0 5px;}
.eq-tile-value{font-size:26px;font-weight:700;font-family:'Outfit',sans-serif;margin:0;color:var(--charcoal);}
.eq-tile-sub{font-size:11px;color:var(--muted);margin:3px 0 0;}
.equity-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.equity-card-hdr .card-title{margin:0;}
.equity-badge{font-size:10px;font-weight:700;letter-spacing:.07em;background:rgba(176,141,87,.12);color:var(--brass-dark);padding:2px 9px;border-radius:12px;}

/* CHARTS */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
.chart-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:24px;}
.chart-wrap{position:relative;height:260px;}
@media(max-width:900px){.charts-row{grid-template-columns:1fr;}}

/* LOGRADO */
.logrado-section{margin:20px 0;}
.logrado-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.logrado-bar-wrap{margin:10px 0;}
.logrado-label{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
.logrado-track{background:var(--border);border-radius:6px;height:26px;overflow:hidden;}
.logrado-fill{height:100%;border-radius:6px 0 0 6px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:#fff;transition:width .4s ease;}
.logrado-values{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;}
.logrado-expect{font-size:11px;font-weight:700;color:var(--charcoal);letter-spacing:.01em;}

/* SCENARIO CHIPS */
.scen-filters{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 0 6px;}
.scen-filters-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px;white-space:nowrap;}
.scen-chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:var(--white);transition:all .15s;white-space:nowrap;}
.scen-chip.active{background:var(--charcoal);color:var(--white);border-color:var(--charcoal);}
.scen-chip:hover{border-color:var(--muted);}

/* DATA TABLE */
.tbl-wrap{overflow-x:auto;margin:0;}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
table.data th{background:var(--charcoal);color:var(--white);padding:10px 14px;text-align:right;font-weight:600;position:sticky;top:0;white-space:nowrap;font-size:12px;}
table.data th:first-child{text-align:left;border-radius:10px 0 0 0;}
table.data th:last-child{border-radius:0 10px 0 0;}
table.data td{padding:8px 14px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top;}
table.data td:first-child{text-align:left;font-weight:500;}
table.data tr.section-hdr td{background:rgba(164,172,140,.12);font-weight:700;color:var(--olive);font-size:11px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;}
table.data tr.section-hdr:hover td{background:rgba(164,172,140,.2);}
table.data tr.row-total td{font-weight:700;background:rgba(164,172,140,.06);}
table.data tr.row-hero td{font-weight:700;background:rgba(176,141,87,.08);color:var(--brass-dark);font-size:14px;}
table.data tr.row-pct td{color:var(--muted);font-size:12px;}
table.data tr.row-expandable td:first-child{cursor:pointer;}
table.data tr.row-expandable td:first-child::before{content:"▸ ";color:var(--brass);}
table.data tr.row-expandable.open td:first-child::before{content:"▾ ";}
table.data tr.detail-row{display:none;}
table.data tr.detail-row.show{display:table-row;}
table.data tr.detail-row td{padding-left:32px;font-size:12px;color:var(--muted);background:rgba(176,141,87,.04);}
.val-neg{color:var(--error);}
.val-cell{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.delta-chip{font-size:10px;font-weight:700;letter-spacing:.02em;padding:1px 5px;border-radius:3px;line-height:1.4;}
.delta-chip.dp{color:#3d6b35;background:rgba(95,104,68,.1);}
.delta-chip.dn{color:var(--error);background:rgba(154,59,59,.08);}
.delta-chip.dn-exp{color:#3d6b35;background:rgba(95,104,68,.1);}
.delta-chip.dp-exp{color:var(--error);background:rgba(154,59,59,.08);}
.sec-arrow{display:inline-block;width:14px;text-align:center;color:var(--brass);margin-right:4px;}
.sc-tag{font-size:9px;font-weight:700;letter-spacing:.06em;background:rgba(176,141,87,.15);color:var(--brass-dark);padding:1px 6px;border-radius:3px;margin-left:6px;text-transform:none;vertical-align:middle;}

/* Numeric editing highlight */
td[data-num-key][contenteditable=true]:focus{
  background:rgba(176,141,87,.12)!important;
  border-radius:4px;
  outline:1px solid var(--brass);
}
td[data-num-key][contenteditable=true]{cursor:text;outline:none;}
.edit-mode-banner{display:none;background:rgba(72,77,49,.07);border:1px solid rgba(72,77,49,.2);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--olive);margin-bottom:10px;align-items:center;gap:10px;}
.edit-mode-banner.show{display:flex;}

/* Ocultar columnas de escenario — hasta 6 columnas no-Base */
table.data.hide-col-1 tr>:nth-child(3){display:none;}
table.data.hide-col-2 tr>:nth-child(4){display:none;}
table.data.hide-col-3 tr>:nth-child(5){display:none;}
table.data.hide-col-4 tr>:nth-child(6){display:none;}
table.data.hide-col-5 tr>:nth-child(7){display:none;}
table.data.hide-col-6 tr>:nth-child(8){display:none;}

/* TAB CONTENT */
.tab-content{display:none;animation:fadeIn .2s ease;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

/* VERTIENTES */
.vertientes-wrap{margin:20px 0;}
.vertientes-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;padding:14px 18px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);font-weight:700;font-size:13px;font-family:'Outfit',sans-serif;color:var(--charcoal);user-select:none;transition:background .15s;}
.vertientes-toggle:hover{background:var(--light);}
.vertientes-toggle .sec-arrow{color:var(--brass);}
.vertientes-body{display:none;background:var(--white);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:20px;}
.vertientes-body.open{display:block;}
.vertientes-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.vertiente-card{border:1px solid var(--border);border-radius:12px;padding:20px;}
.vertiente-card h3{font-size:13px;font-weight:700;margin:0 0 14px;color:var(--charcoal);}
.vertiente-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.vertiente-row:last-child{border-bottom:none;}
.vertiente-row .label{color:var(--muted);font-weight:500;}
.vertiente-row .value{font-weight:700;font-family:'Outfit',sans-serif;}
.vertiente-row.highlight .value{color:var(--brass-dark);font-size:15px;}

/* ADMIN MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(40,40,35,.55);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:flex-start;justify-content:flex-end;padding:70px 28px 0;}
.modal-backdrop.open{display:flex;}
.admin-modal{background:var(--white);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.22);width:420px;max-width:calc(100vw - 40px);max-height:82vh;overflow-y:auto;display:flex;flex-direction:column;}
.modal-head{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:1;}
.modal-head h2{margin:0;font-size:15px;font-weight:700;font-family:'Outfit',sans-serif;}
.modal-close{background:none;border:none;cursor:pointer;font-size:17px;color:var(--muted);padding:2px 7px;border-radius:6px;line-height:1;}
.modal-close:hover{background:var(--border);}
.modal-body{padding:18px 22px 22px;flex:1;}
.modal-section{margin-bottom:18px;}
.modal-section:last-child{margin-bottom:0;}
.modal-section h3{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px;}
.form-group{margin-bottom:10px;}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;}
.form-group input[type=text],.form-group input[type=email],.form-group input[type=password]{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;background:var(--light);transition:border-color .15s;}
.form-group input[type=file]{width:100%;padding:6px 0;font-size:12px;cursor:pointer;}
.form-group input:focus{border-color:var(--olive);}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--olive);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--green);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--charcoal);}
.btn-ghost:hover{background:var(--border);}
.btn-danger{background:none;border:1px solid rgba(154,59,59,.3);color:var(--error);}
.btn-danger:hover{background:rgba(154,59,59,.05);}
.btn-sm{padding:4px 11px;font-size:11px;border-radius:6px;}
.ver-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
.ver-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:12px;}
.ver-item.active-ver{border-color:var(--sage);background:rgba(164,172,140,.06);}
.ver-item-info{flex:1;min-width:0;}
.ver-item-label{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ver-item-meta{font-size:10px;color:var(--muted);margin-top:2px;}
.badge-active{font-size:10px;font-weight:700;background:rgba(72,77,49,.1);color:var(--olive);padding:2px 8px;border-radius:4px;white-space:nowrap;}
.status-msg{font-size:12px;padding:8px 11px;border-radius:8px;margin-top:10px;}
.status-msg.ok{background:rgba(72,77,49,.08);color:var(--green);}
.status-msg.err{background:rgba(154,59,59,.08);color:var(--error);}
.status-msg.info{background:rgba(164,172,140,.1);color:var(--muted);}
.user-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;background:var(--light);border-radius:8px;font-size:12px;margin-bottom:14px;}
.user-email{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sep-line{border:none;border-top:1px solid var(--border);margin:16px 0;}

/* LABELS EDITOR */
.labels-editor{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:0 10px;}
.label-edit-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);}
.label-edit-row:last-child{border-bottom:none;}
.label-default{font-size:10px;color:var(--muted);min-width:0;flex:0 0 auto;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.label-inp{flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--light);outline:none;transition:border-color .15s;}
.label-inp:focus{border-color:var(--olive);}
.label-sec-hdr{font-size:10px;font-weight:700;color:var(--olive);text-transform:uppercase;letter-spacing:.06em;padding:8px 0 2px;display:block;}

@media(max-width:700px){
  .hero-row{grid-template-columns:1fr 1fr;}
  .stat-value.hero{font-size:30px;}
  .logrado-grid,.vertientes-grid,.equity-row{grid-template-columns:1fr;}
  .modal-backdrop{align-items:flex-end;justify-content:center;padding:0;}
  .admin-modal{width:100%;max-width:100%;border-radius:var(--radius) var(--radius) 0 0;max-height:88vh;}
}
</style>

/* ===== RECALCULO EN CASCADA ===== */
/* El consolidado se deriva sumando E1 + E2, no se lee del Excel.
   Asi la reasignacion de la provision entre etapas nunca lo mueve. */
const CONS_INPUTS = ['ingresos','costoObra','gestionLicencias','contratistaGeneral',
  'indirectoCorp','gastosOpObra','proyectoEjecutivo','activosFijos','legal','sat',
  'publicidad','comisionComercializacion','interesesBX','comisionAperturaBX',
  'otrosGastosFin','adelantoEtapa2','equipamiento','tierraBase'];

function derivarConsolidado(){
  if(!currentData.e1 || !currentData.e2 || !currentData.cons) return;
  const a = currentData.e1.data, b = currentData.e2.data, c = currentData.cons.data;
  const ia = currentData.e1.scenarios.length - 1;
  const ib = currentData.e2.scenarios.length - 1;
  CONS_INPUTS.forEach(k => {
    c[k] = c[k] || [];
    c[k][0] = (a[k]?.[ia] || 0) + (b[k]?.[ib] || 0);
  });
  c.aniosProy = [9];
}

function recalculate(tabKey) {
  if(tabKey === 'cons') derivarConsolidado();
  const tab = currentData[tabKey];
  if (!tab || !tab.data) return;
  const d = tab.data;
  const n = tab.scenarios.length;
  const P = currentData.palancas || {tierra:'capital', provMonto:0, provFase:'e1'};
  const EQ = currentData.equityTotal || 0;

  for (let i = 0; i < n; i++) {
    // --- PALANCA 2: la provision entra al Hard Cost solo de la etapa asignada.
    //     En consolidado siempre entra: mover de E1 a E2 no crea ni destruye dinero.
    const prov = (tabKey === 'cons')
      ? (P.provFase === 'none' ? 0 : (P.provMonto || 0))   // una sola vez, venga de donde venga
      : (P.provFase === tabKey ? (P.provMonto || 0) : 0);
    d.provision = d.provision || [];
    d.provision[i] = prov;
    d.sumaHC = d.sumaHC || [];
    d.sumaHC[i] = (d.costoObra[i] || 0) + prov;

    d.utilidadBruta = d.utilidadBruta || [];
    d.utilidadBruta[i] = (d.ingresos[i] || 0) - d.sumaHC[i];

    d.totalGastosOperativos = d.totalGastosOperativos || [];
    d.totalGastosOperativos[i] = ['gestionLicencias','contratistaGeneral','indirectoCorp',
      'gastosOpObra','proyectoEjecutivo','activosFijos','legal','sat']
      .reduce((s, k) => s + (d[k]?.[i] || 0), 0);

    d.totalGastosComercializacion = d.totalGastosComercializacion || [];
    d.totalGastosComercializacion[i] = (d.publicidad[i]||0) + (d.comisionComercializacion[i]||0);

    d.utilidadOperativa = d.utilidadOperativa || [];
    d.utilidadOperativa[i] = d.utilidadBruta[i] - d.totalGastosOperativos[i]
                           - d.totalGastosComercializacion[i];

    d.totalGastosFinancieros = d.totalGastosFinancieros || [];
    d.totalGastosFinancieros[i] = (d.interesesBX[i]||0) + (d.comisionAperturaBX[i]||0)
                                + (d.otrosGastosFin[i]||0);

    // --- PALANCA 1: la tierra entra al P&L solo bajo el criterio de gasto operativo
    const tierra = (P.tierra === 'gasto') ? (d.tierraBase?.[i] || 0) : 0;
    d.totalCostoTierra = d.totalCostoTierra || [];
    d.totalCostoTierra[i] = tierra;

    d.utilidadNeta = d.utilidadNeta || [];
    d.utilidadNeta[i] = d.utilidadOperativa[i] - d.totalGastosFinancieros[i]
                      - tierra - (d.adelantoEtapa2[i]||0) - (d.equipamiento[i]||0);

    d.margen = d.margen || [];
    d.margen[i] = d.ingresos[i] ? d.utilidadNeta[i] / d.ingresos[i] : 0;

    // --- Base de inversion: cambia con la palanca de tierra
    d.inversionSocios = d.inversionSocios || [];
    d.inversionSocios[i] = (P.tierra === 'capital') ? EQ : (d.tierraBase?.[i] || 0);

    if (!d.aniosProy[i]) d.aniosProy[i] = (tabKey === 'e1' ? 6 : 9);

    // --- Multiplo y TIR sobre la base vigente
    d.multiplo = d.multiplo || [];
    d.multiplo[i] = d.inversionSocios[i] ? d.utilidadNeta[i] / d.inversionSocios[i] : 0;
    d.tir = d.tir || [];
    d.tir[i] = d.multiplo[i] / (d.aniosProy[i] || 1);
  }
}



/* ===== GATE DE LOGIN ===== */
function mostrarGate(msg){
  document.getElementById('gate')?.classList.remove('oculto');
  const e=document.getElementById('gate-err');
  if(e){ e.textContent = msg||''; e.classList.toggle('on', !!msg); }
}
function ocultarGate(){ document.getElementById('gate')?.classList.add('oculto'); }

async function entrar(){
  const mail=(document.getElementById('gate-mail')?.value||'').trim();
  const pass=document.getElementById('gate-pass')?.value||'';
  if(!mail||!pass){ mostrarGate('Captura correo y contrasena.'); return; }
  if(!supa){ mostrarGate('No hay conexion con el servidor.'); return; }
  const {data,error}=await supa.auth.signInWithPassword({email:mail,password:pass});
  if(error){ mostrarGate('Correo o contrasena incorrectos.'); return; }
  userSession=data.session;
  await arrancarSesion();
}

async function arrancarSesion(){
  await checkAdminRole();
  await loadActiveVersion();
  await cargarCortes();
  await loadVersionHistory();
  if(!currentData.palancas) currentData.palancas = JSON.parse(JSON.stringify(PAL_DEFAULT));
  recalculate('e1'); recalculate('e2'); recalculate('cons');
  fijarRefConsolidado();
  pintarBannerCorte();
  pintarPalancas();
  renderAll();
  ocultarGate();
}

async function salir(){
  if(supa) await supa.auth.signOut();
  userSession=null; isAdmin=false; versionHistory=[];

}

    data:          semilla,
    nota:          'Siembra automatica desde el HTML publicado'
  }).select('id,data').limit(1);
  if(e2){ console.warn(e2); return null; }
  await cargarCortes();
  return nueva && nueva[0] ? nueva[0] : null;
}

function fmtMonto(v){
  return '$' + Math.round(v||0).toLocaleString('es-MX');
}

function pintarPalancas(){
  const P = currentData.palancas; if(!P) return;
  document.getElementById('pal-t-cap')?.classList.toggle('on', P.tierra==='capital');
  document.getElementById('pal-t-gas')?.classList.toggle('on', P.tierra==='gasto');
  ['e1','e2','none'].forEach(f =>
    document.getElementById('pal-f-'+f)?.classList.toggle('on', P.provFase===f));
  const inp = document.getElementById('pal-monto');
  if(inp && document.activeElement !== inp) inp.value = fmtMonto(P.provMonto);

  const FASE = {e1:'Etapa 1', e2:'Etapa 2', none:'sin asignar'};
  const sello = document.getElementById('sello-criterio');
  if(sello){
    sello.innerHTML = `Tierra: <b>${P.tierra==='capital'?'capital aportado':'gasto operativo'}</b>`
                    + ` &nbsp;·&nbsp; Provision <b>${fmtMonto(P.provMonto)}</b> en <b>${FASE[P.provFase]}</b>`;
  }

  // Aviso si la configuracion no es la guardada
  const cambiado = JSON.stringify(P) !== JSON.stringify(PAL_DEFAULT);
  const av = document.getElementById('pal-aviso');
  if(av){

    if(t) t.textContent = 'Configuracion modificada. No es la guardada como default.';
  }

  if(g) g.style.display = (isAdmin && cambiado) ? 'inline-block' : 'none';
}

function aplicarPalancas(){
  recalculate('e1'); recalculate('e2'); recalculate('cons');
  validarConsolidado();
  pintarPalancas();
  renderAll();
}

function setTierra(modo){
  currentData.palancas.tierra = modo;
  aplicarPalancas();
}

function setProvFase(fase){
  currentData.palancas.provFase = fase;
  aplicarPalancas();
}

function setProvMonto(v){
  const num = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  if(isNaN(num)) { pintarPalancas(); return; }
  currentData.palancas.provMonto = num;
  aplicarPalancas();
}

function resetPalancas(){
  currentData.palancas = JSON.parse(JSON.stringify(PAL_DEFAULT));
  aplicarPalancas();
}

/* Mover la provision entre etapas NO puede cambiar el consolidado: es reasignacion
   interna. Cambiar el criterio de tierra SI debe moverlo — eso es el punto de la
   palanca. Por eso la referencia se guarda por criterio de tierra. */
const _consRef = {};
function refKey(){
  const P = currentData.palancas || {};
  return `${P.tierra}|${P.provMonto}`;   // mismo criterio y mismo monto
}
function validarConsolidado(){
  const el = document.getElementById('valida-cons');
  if(!el || !currentData.cons?.data?.utilidadNeta) return;
  const k = refKey();
  const actual = currentData.cons.data.utilidadNeta[0];
  if(_consRef[k] === undefined){ _consRef[k] = actual; el.classList.remove('on'); return; }
  const dif = Math.abs(actual - _consRef[k]);
  if(dif > 1){
    el.classList.add('on');
    el.textContent = `Alerta de consistencia: el consolidado se movio ${fmtMonto(dif)} `
      + `al reasignar la provision entre etapas. Eso no deberia pasar — es dinero que `
      + `cambia de bolsillo, no dinero nuevo. Revisar la cascada antes de usar estas cifras.`;
  } else {
    el.classList.remove('on');
  }
}
function fijarRefConsolidado(){
  const v = currentData.cons?.data?.utilidadNeta?.[0];
  if(v !== undefined) _consRef[refKey()] = v;
}

async function guardarPalancas(){
  if(!supa || !isAdmin) return;
  const ver = await obtenerOCrearVersion();
  if(!ver){ alert('No se pudo acceder a la version. Revisa tu sesion.'); return; }
  const nd = {...ver.data, palancas: currentData.palancas};
  const {error} = await supa.from('cierre_versiones').update({data:nd}).eq('id',ver.id);
  if(error){ alert('No se pudo guardar: '+error.message); return; }
  await bitacora('palancas','configuracion','palancas',
                 JSON.stringify(PAL_DEFAULT), JSON.stringify(currentData.palancas),
                 null, 'Cambio de default de supuestos');
  Object.assign(PAL_DEFAULT, JSON.parse(JSON.stringify(currentData.palancas)));
  pintarPalancas();
  alert('Configuracion guardada como default.');
}

let corteActivo   = null;   // fecha_corte del dato en pantalla (YYYY-MM-DD)
let corteVigente  = null;   // el mas reciente disponible
let cortesCache   = [];
let enHistorico   = false;

function fmtFechaLarga(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const MES=['enero','febrero','marzo','abril','mayo','junio','julio',
             'agosto','septiembre','octubre','noviembre','diciembre'];
  return `${d} de ${MES[m-1]} de ${y}`;
}

function pintarBannerCorte(){
  const b = document.getElementById('corte-banner');
  const r = document.getElementById('corte-reset');
  if(!b) return;
  if(enHistorico && corteActivo){
    b.classList.add('on');
    b.innerHTML = `Viendo el corte al <b>${fmtFechaLarga(corteActivo)}</b>. `
                + `No es el dato vigente y la edicion esta desactivada. `
                + `<a href="#" onclick="resetCorte();return false;" style="color:var(--brass-dark);font-weight:700">Volver al vigente</a>`;
    if(r) r.style.display='inline-block';
  } else {
    b.classList.remove('on');
    if(r) r.style.display='none';
  }
}

async function cargarCortes(){
  if(!supa) return [];
  try{
    const {data} = await supa.from('cierre_versiones')
      .select('fecha_corte,version_label')
      .eq('dashboard_id',DASHBOARD_ID)
      .order('fecha_corte',{ascending:false});
    cortesCache = data||[];
    if(cortesCache.length){
      corteVigente = cortesCache[0].fecha_corte;
      const inp = document.getElementById('corte-input');
      if(inp){
        inp.value = corteVigente;
        inp.max   = corteVigente;
        const mas_viejo = cortesCache[cortesCache.length-1].fecha_corte;
        inp.min = mas_viejo;
      }
    }
    return cortesCache;
  }catch(e){ return []; }
}

async function onCorteChange(){
  const inp = document.getElementById('corte-input');
  if(!inp || !inp.value || !supa) return;
  const f = inp.value;
  try{
    const {data,error} = await supa.rpc('cierre_a_fecha',
      {p_dashboard:DASHBOARD_ID, p_fecha:f});
    if(error || !data || !data.length){
      setCorteAviso(`No hay ningun corte anterior al ${fmtFechaLarga(f)}.`);
      return;
    }
    const v = data[0];
    currentData  = v.data;
    corteActivo  = v.fecha_corte;
    enHistorico  = (v.fecha_corte !== corteVigente);
    document.getElementById('ver-indicator').textContent = v.version_label;
    pintarBannerCorte();
    renderAll();
  }catch(e){ console.warn('Error al consultar corte:',e); }
}

function setCorteAviso(msg){
  const b=document.getElementById('corte-banner');
  if(!b)return;
  b.classList.add('on');
  b.innerHTML = msg + ` <a href="#" onclick="resetCorte();return false;" style="color:var(--brass-dark);font-weight:700">Volver al vigente</a>`;
}

async function resetCorte(){
  const inp=document.getElementById('corte-input');
  if(inp && corteVigente) inp.value = corteVigente;
  enHistorico=false; corteActivo=corteVigente;
  pintarBannerCorte();
  await loadActiveVersion();
  renderAll();
}

  heroHtml += `<div class="stat-tile"><p class="stat-label">TIR</p><p class="stat-value" id="hero-tir-${id}">${fmtPct(d.tir?.[last])}</p><p class="stat-sub">${scenarios[last]}</p></div>`;
  heroHtml += `<div class="stat-tile"><p class="stat-label">Multiplo</p><p class="stat-value" id="hero-mult-${id}">${fmtMult(d.multiplo?.[last])}</p><p class="stat-sub">${scenarios[last]}</p></div>`;
  heroHtml += '</div>';

  /* Equity Dia 1 (solo E1) */
  let equityHtml = '';
  if(id === 'e1' && currentData.equity){
    const eq = currentData.equity;
    equityHtml = `<div class="card"><div class="equity-card-hdr"><p class="card-title">Capital en Juego — Equity Dia 1</p><span class="equity-badge">Aportacion Total: ${fmtCur(eq.total)}</span></div><div class="equity-row"><div class="eq-tile"><p class="eq-tile-label">Total Ambas Etapas</p><p class="eq-tile-value">${fmtCur(eq.total)}</p><p class="eq-tile-sub">E1 + E2</p></div><div class="eq-tile"><p class="eq-tile-label">Etapa 1</p><p class="eq-tile-value">${fmtCur(eq.e1)}</p><p class="eq-tile-sub">Tierra: ${fmtCur(eq.tierraE1)}</p></div><div class="eq-tile"><p class="eq-tile-label">Etapa 2</p><p class="eq-tile-value">${fmtCur(eq.e2)}</p><p class="eq-tile-sub">Tierra: ${fmtCur(eq.tierraE2)}</p></div></div></div>`;
  }

  /* Charts */
  const cid1=id+'_ing', cid2=id+'_util';
  const chartsHtml = `<div class="charts-row"><div class="chart-card"><p class="card-title">Ingresos por Ventas</p><div class="chart-wrap"><canvas id="${cid1}"></canvas></div></div><div class="chart-card"><p class="card-title">Utilidad Neta</p><div class="chart-wrap"><canvas id="${cid2}"></canvas></div></div></div>`;

  /* Logrado */
  let logradoHtml = '';
  if(logradoData){
    logradoHtml='<div class="logrado-section"><div class="card"><p class="card-title">Avance Real — Logrado vs Por Lograr</p><div class="logrado-grid">';
    for(const mes of ['jun','jul']){
      if(!logradoData[mes]) continue;
      const lg=logradoData[mes].logrado, pl=logradoData[mes].porLograr;
      const label=mes==='jun'?'Junio 2026':'Julio 2026';
      const mets=[{k:'ingresos',l:'Ingresos',src:'ingresos'},
                  {k:'utilidadNeta',l:'Utilidad Neta',src:'utilidadNeta'},
                  {k:'costoObra',l:'Costo Obra',src:'sumaHC'}];
      logradoHtml+=`<div><h3 style="font-size:14px;margin:0 0 12px;">${label}</h3>`;
      for(const m of mets){
        /* La expectativa sale del P&L recalculado, no del dato fijo del Excel:
           asi sigue a las palancas. Lo logrado es un hecho y no se toca;
           lo por lograr es la diferencia contra la expectativa vigente. */
        const expect = d[m.src]?.[last];
        const tot = (expect !== undefined) ? expect : ((lg[m.k]||0)+(pl[m.k]||0));
        const logr = lg[m.k]||0;
        const falta = tot - logr;
        const pct=tot?Math.max(0,Math.min(100,(logr/tot)*100)):0;
        const col=m.k==='utilidadNeta'?'var(--brass)':'var(--olive)';
        logradoHtml+=`<div class="logrado-bar-wrap"><div class="logrado-label"><span>${m.l}</span><span class="logrado-expect">Expectativa: ${fmtCur(tot)}</span></div><div class="logrado-track"><div class="logrado-fill" style="width:${pct.toFixed(1)}%;background:${col}">${pct.toFixed(0)}%</div></div><div class="logrado-values"><span>Logrado: ${fmtCur(logr)}</span><span>Por lograr: ${fmtCur(falta)}</span></div></div>`;
      }
      logradoHtml+='</div>';
    }
    logradoHtml+='</div></div></div>';
  }

  /* Scenario chips */
  let filtersHtml = '';
  if(scenarios.length > 1){
    filtersHtml='<div class="scen-filters"><span class="scen-filters-label">Escenarios:</span>';
    for(let i=1;i<scenarios.length;i++){
      const hidden=_hiddenCols[id]?.has(i);
      filtersHtml+=`<button class="scen-chip${hidden?'':' active'}" data-col="${i}" onclick="toggleScenCol('${id}',${i},this)">${scenarios[i]}</button>`;

  /* Tabla */
  let tblHtml=`<div class="tbl-wrap"><table class="data" id="tbl-${id}"><thead><tr><th>Concepto</th>`;
  for(let i=0;i<scenarios.length;i++)
    tblHtml+=`<th>${scenarios[i]}${i===0?' <span style="opacity:.4;font-weight:400;font-size:10px">(Base)</span>':''}</th>`;
  tblHtml+='</tr></thead><tbody>';

  let curSec = null;

  for(const row of ROWS){
    if(row.type==='section'){
      curSec=row.key;
      const collapsed=(_secStates[id+'_'+row.key]===false);
      const lbl = currentData.labels?.[row.key] || currentData.scLabels?.[row.key] || row.label;
      const scTag = row.sc ? `<span class="sc-tag">${row.sc}</span>` : '';
      tblHtml+=`<tr class="section-hdr" data-sec-hdr="${row.key}" onclick="toggleSection('${id}','${row.key}',this)"><td colspan="${scenarios.length+1}"><span class="sec-arrow">${collapsed?'&#9658;':'&#9660;'}</span>${lbl}${scTag}</td></tr>`;
      continue;
    }

    const trCls=row.type==='total'?'row-total':row.type==='hero'?'row-hero':row.type==='pct'?'row-pct':row.type==='expandable'?'row-expandable':'';
    const secAttr=curSec?` data-sec="${curSec}"`:'';
    const secHidden=(_secStates[id+'_'+curSec]===false)?' style="display:none"':'';
    let onclk='';
    if(row.type==='expandable') onclk=` onclick="toggleDetail(this,'${id}','${row.key}')"`;

    const provCls = row.esProvision ? ' provision' : '';
    tblHtml+=`<tr class="${trCls}${provCls}"${secAttr}${secHidden}${onclk}>`;
    /* Label cell */
    const lbl = currentData.labels?.[row.key] || row.label;
    const formulaDrivenNote = row.formulaDriven ? ' <span style="font-size:9px;opacity:.5;font-style:italic">fórmula</span>' : '';
    const chipEst = row.esProvision ? '<span class="chip-est">estimado</span>' : '';
    tblHtml+=`<td data-rowkey="${row.key}">${lbl}${formulaDrivenNote}${chipEst}</td>`;

    for(let i=0;i<scenarios.length;i++){
      const rawVal=d[row.key]?.[i];
      if(rawVal===undefined){tblHtml+='<td>-</td>';continue;}
      const displayVal=(row.isExpense&&rawVal>0)?-rawVal:rawVal;
      const formatted=row.fmt(displayVal);
      const isNeg=displayVal<0;
      let deltaHtml='';
      if(i>0&&!row.noDelta){
        const baseRaw=d[row.key]?.[0];
        if(baseRaw!==undefined&&baseRaw!==0){
          const pctDiff=((rawVal-baseRaw)/Math.abs(baseRaw))*100;
          if(Math.abs(pctDiff)>=0.05){
            const up=pctDiff>0;
            const cls=row.isExpense?(up?'dp-exp':'dn-exp'):(up?'dp':'dn');
            deltaHtml=`<span class="delta-chip ${cls}">${up?'&#9650;':'&#9660;'} ${up?'+':''}${pctDiff.toFixed(1)}%</span>`;
          }
        }
      }
      /* Admin numeric editing — last column only, for editable keys */
      const isEditableCell = isAdmin && i===last && EDITABLE_KEYS.has(row.key);
      const numAttr = isEditableCell ? ` data-num-key="${row.key}" data-tab="${id}" data-col="${i}"` : '';
      const rawDisplay = isEditableCell ? rawVal : null;
      const dataRaw = rawDisplay!==null ? ` data-raw="${rawVal}"` : '';
      tblHtml+=`<td${numAttr}${dataRaw}><div class="val-cell${isNeg?' val-neg':''}"><span class="fmt-val">${formatted}</span>${deltaHtml}</div></td>`;
    }
    tblHtml+='</tr>';

    /* Detalle: devolucion */
    if(row.key==='devolucion'){
      for(const det of DEVOL_DETAIL){
        tblHtml+=`<tr class="detail-row"${secAttr}${secHidden} data-parent="devolucion-${id}"><td data-rowkey="${det.key}">${currentData.labels?.[det.key]||det.label}</td>`;

  /* Vertientes (solo E1) */

      vertientesHtml += `<div class="vertiente-row"><span class="label">Devolucion Total</span><span class="value">${fmtCur(vd.devolucion)}</span></div>`;
      vertientesHtml += `<div class="vertiente-row"><span class="label">Margen</span><span class="value">${fmtPct(vd.margen)}</span></div>`;
      vertientesHtml += `<div class="vertiente-row"><span class="label">Multiplo</span><span class="value">${fmtMult(vd.multiplo)}</span></div>`;
      vertientesHtml += `<div class="vertiente-row"><span class="label">TIR</span><span class="value">${fmtPct(vd.tir)}</span></div>`;
      vertientesHtml += '</div>';
    }
    vertientesHtml += '</div></div></div>';
  }

  panel.innerHTML = bannerHtml + heroHtml + equityHtml + chartsHtml + logradoHtml + filtersHtml + tblHtml + vertientesHtml;

  restoreColStates(id);
  renderLineChart(cid1, scenarios, d.ingresos,     'Ingresos',      '--brass');
  renderLineChart(cid2, scenarios, d.utilidadNeta, 'Utilidad Neta', '--olive');
}

/* ===== SECCIONES COLAPSABLES ===== */
function toggleSection(tabId, secKey, headerRow){
  const stKey=tabId+'_'+secKey;
  const isOpen=(_secStates[stKey]!==false);
  const rows=document.querySelectorAll(`#panel-${tabId} tr[data-sec="${secKey}"]`);
  const arrow=headerRow.querySelector('.sec-arrow');
  if(isOpen){
    rows.forEach(r=>r.style.display='none');
    _secStates[stKey]=false;
    if(arrow)arrow.innerHTML='&#9658;';
  } else {
    rows.forEach(r=>r.style.display='');

function getDelta(curr,base,isExpense){

  const d=((curr-base)/Math.abs(base))*100,up=d>=0,good=isExpense?!up:up;

}

function activateNumericEditing(){
  if(!puedeEditar()) return;
  document.querySelectorAll('td[data-num-key]').forEach(td=>{
    if(td.getAttribute('contenteditable')==='true') return;
    td.setAttribute('contenteditable','true');
    td.title='Clic para editar cifra — Enter para recalcular';
    const fmtSpan=td.querySelector('.fmt-val');

    td.addEventListener('focus',()=>{
      /* Show raw number for editing */
      const raw=parseFloat(td.dataset.raw||'0');
      if(fmtSpan) fmtSpan.textContent=raw.toFixed(2);
      td.querySelector('.delta-chip')?.remove();
    });

    td.addEventListener('blur',()=>{
      const raw=td.querySelector('.fmt-val')?.textContent||td.textContent;
      const num=parseFloat(String(raw).replace(/[$,()\s]/g,''));
      if(!isNaN(num)){
        const key=td.dataset.numKey, tabKey=td.dataset.tab, colIdx=parseInt(td.dataset.col);
        td.dataset.raw=num;
        const antes = currentData[tabKey].data[key][colIdx];
        currentData[tabKey].data[key][colIdx]=num;
        recalculate(tabKey);
        recalculate('cons');            // el consolidado se deriva de E1+E2
        updateTabDisplay(tabKey);
        updateTabDisplay('cons');
        const esc = currentData[tabKey].scenarios[colIdx];
        bitacora(tabKey,'cifra',key,antes,num,esc,null);
        scheduleNumericSave(tabKey);
      }
    });

    td.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();td.blur();}
      /* Allow: numbers, dot, minus, backspace, arrows, del */
      if(!/[\d.\-]/.test(e.key)&&!['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(e.key)&&!e.metaKey&&!e.ctrlKey){
        e.preventDefault();
      }
    });
  });
}

/* Update displayed values after recalc without full re-render */
function updateTabDisplay(tabKey){
  const tab = currentData[tabKey];
  if(!tab) return;
  const d = tab.data;
  const last = tab.scenarios.length - 1;

  /* Update hero tiles */
  const hUtil=document.getElementById(`hero-util-${tabKey}`);
  const hMrg=document.getElementById(`hero-margen-${tabKey}`);
  const hTir=document.getElementById(`hero-tir-${tabKey}`);
  const hMlt=document.getElementById(`hero-mult-${tabKey}`);
  if(hUtil) hUtil.textContent=fmtCur(d.utilidadNeta?.[last]);
  if(hMrg) hMrg.textContent=fmtPct(d.margen?.[last]);
  if(hTir) hTir.textContent=fmtPct(d.tir?.[last]);
  if(hMlt) hMlt.textContent=fmtMult(d.multiplo?.[last]);

  /* Update all numeric cells in this tab */
  const colLast = last;
  document.querySelectorAll(`#panel-${tabKey} table.data tbody tr`).forEach(tr=>{
    /* Get row key from first td */
    const firstTd = tr.querySelector('td[data-rowkey]');
    if(!firstTd) return;
    const key = firstTd.dataset.rowkey;
    if(!key||key.startsWith('_')) return;
    const row = ROWS.find(r=>r.key===key);
    if(!row||!row.fmt) return;
    /* Update last column cell */
    const cells = tr.querySelectorAll('td');
    const targetCell = cells[colLast+1]; /* +1 for label col */
    if(!targetCell) return;
    const rawVal = d[key]?.[last];
    if(rawVal===undefined) return;
    const displayVal=(row.isExpense&&rawVal>0)?-rawVal:rawVal;
    const formatted = row.fmt(displayVal);
    const fmtSpan = targetCell.querySelector('.fmt-val');
    if(fmtSpan) fmtSpan.textContent=formatted;
    targetCell.dataset.raw=rawVal;
    /* Toggle neg class */
    const valCell=targetCell.querySelector('.val-cell');
    if(valCell){ valCell.classList.toggle('val-neg',displayVal<0); }
  });

  /* Update chart */
  const chartIngresos=charts[tabKey+'_ing'], chartUtil=charts[tabKey+'_util'];
  if(chartIngresos){ chartIngresos.data.datasets[0].data=d.ingresos; chartIngresos.update(); }
  if(chartUtil){ chartUtil.data.datasets[0].data=d.utilidadNeta; chartUtil.update(); }
}

/* ===== EXCEL PARSER v5 ===== */
function getNum(row,col){const v=row?row[col]:undefined;if(v==null||v==='')return 0;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[$,%\s]/g,''));return isNaN(n)?0:n;}

function parseExcelData(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject('Error leyendo el archivo');
    reader.onload=e=>{
      try{
        const XLIBX=window.XLSX;if(!XLIBX){reject('SheetJS no disponible');return;}
        const wb=XLIBX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets['Resumen E1-E2'];if(!ws){reject('Hoja "Resumen E1-E2" no encontrada');return;}
        const raw=XLIBX.utils.sheet_to_json(ws,{header:1,defval:null});
        const hdr=raw[2]||[];

        /* Auto-detect E1/E2 column ranges */
        /* E1: cols C-I (indices 2-8) = up to 7 scenarios */
        /* E2: cols U-Z (indices 20-25) = up to 6 scenarios */
        /* Consolidado: AJ-AK (indices 35-36) */
        let E1=[],E2=[],CS=[];
        for(let c=2;c<=8;c++){ if(hdr[c]&&String(hdr[c]).toLowerCase().includes('escen')) E1.push(c); }
        for(let c=20;c<=25;c++){ if(hdr[c]&&String(hdr[c]).toLowerCase().includes('escen')) E2.push(c); }
        for(let c=35;c<=36;c++){ if(hdr[c]) CS.push(c); }

        /* Fallback to v5 defaults */
        if(!E1.length) E1=[2,3,4,5,6,7,8];
        if(!E2.length) E2=[20,21,22,23,24,25];
        if(!CS.length) CS=[35,36];

        const e1Sc=E1.map(c=>String(hdr[c]||'Escenario').replace(/Escenari[oó]\s*/i,'').trim());
        const e2Sc=E2.map(c=>String(hdr[c]||'Escenario').replace(/Escenari[oó]\s*/i,'').trim());
        const csSc=CS.map(c=>String(hdr[c]||'Consolidado').trim());

        const FMAP=[
          ['ingresos','ingreso'],['costoObra','construcción'],
          ['gestionLicencias','gestión, derechos'],['contratistaGeneral','contratista general'],
          ['indirectoCorp','indirecto corporativo'],['gastosOpObra','gastos operativos de obra'],
          ['proyectoEjecutivo','proyecto ejecutivo'],['activosFijos','activos fijos'],
          ['legal','legal'],['sat','sat (bh'],
          ['publicidad','publicidad'],['comisionComercializacion','comisión por comercialización'],
          ['interesesBX','intereses bx'],['comisionAperturaBX','comisión apertura'],
          ['otrosGastosFin','otros gastos financieros'],
          ['costoTierra','costo de la tierra'],['adelantoEtapa2','adelanto etapa 2'],
          ['equipamiento','equipamiento'],
          ['utilidadNeta','utilidad neta'],['margen','margen'],
          ['inversionSocios','inversión inicial'],['devolucion','utilidad total'],
          ['multiplo','multiplo'],['tir','tir'],['aniosProy','años proy'],
          ['negociacion','negociación'],['cargadores','cargadores'],['elevadoresObra','elevadores de obra'],
        ];
        const e1d={},e2d={},csd={};
        FMAP.forEach(([k])=>{e1d[k]=[];e2d[k]=[];csd[k]=[];});

        for(const row of raw){
          const colB=String(row?.[1]||'').toLowerCase().trim();if(!colB)continue;
          for(const[key,pat]of FMAP){
            if(colB.includes(pat)&&!e1d[key].length){
              e1d[key]=E1.map(c=>getNum(row,c));
              e2d[key]=E2.map(c=>getNum(row,c));
              csd[key]=CS.map(c=>getNum(row,c));
              break;
            }
          }
        }

        if(!e1d.ingresos?.length) throw new Error('No se encontraron datos de Ingresos en "Resumen E1-E2"');

        /* Compute derived totals */
        function computeTotals(d,n){
          d.utilidadBruta=Array.from({length:n},(_,i)=>(d.ingresos[i]||0)-(d.costoObra[i]||0));
          d.totalGastosOperativos=Array.from({length:n},(_,i)=>['gestionLicencias','contratistaGeneral','indirectoCorp','gastosOpObra','proyectoEjecutivo','activosFijos','legal','sat'].reduce((s,k)=>s+(d[k]?.[i]||0),0));
          d.totalGastosComercializacion=Array.from({length:n},(_,i)=>(d.publicidad[i]||0)+(d.comisionComercializacion[i]||0));
          d.utilidadOperativa=Array.from({length:n},(_,i)=>(d.utilidadBruta[i]||0)-(d.totalGastosOperativos[i]||0)-(d.totalGastosComercializacion[i]||0));
          d.totalGastosFinancieros=Array.from({length:n},(_,i)=>(d.interesesBX[i]||0)+(d.comisionAperturaBX[i]||0)+(d.otrosGastosFin[i]||0));
          d.totalCostoTierra=Array.from({length:n},(_,i)=>d.costoTierra[i]||0);
          d.devolucionFixos=Array.from({length:n},(_,i)=>(d.devolucion[i]||0)-(d.utilidadNeta[i]||0)-(d.costoTierra[i]||0)-(d.contratistaGeneral[i]||0)-(d.ingresos[i]||0)*0.02);
        }
        computeTotals(e1d,E1.length);
        computeTotals(e2d,E2.length);
        computeTotals(csd,CS.length);

        /* Logrado — col indices: E1 Jul: R(17)=log, S(18)=porLograr; E2 Jul: AG(32)=log, AH(33)=por */
        const logRows={ingresos:'ingreso',costoObra:'construcción',utilidadNeta:'utilidad neta'};
        const lge1={},ple1={},lge2={},ple2={};
        for(const row of raw){
          const colB=String(row?.[1]||'').toLowerCase().trim();
          for(const[k,pat]of Object.entries(logRows)){
            if(colB.includes(pat)&&!lge1[k]){
              lge1[k]=getNum(row,17);ple1[k]=getNum(row,18);
              lge2[k]=getNum(row,32);ple2[k]=getNum(row,33);
            }
          }
        }

        resolve({
          e1:{scenarios:e1Sc,data:e1d},
          e2:{scenarios:e2Sc,data:e2d},
          cons:{scenarios:csSc,data:csd},
          logrado:{e1:{jun:null,jul:{logrado:lge1,porLograr:ple1}},e2:{jun:null,jul:{logrado:lge2,porLograr:ple2}}},
          equity:currentData.equity||null,
          scLabels:currentData.scLabels||null,
          vertientes:currentData.vertientes||null,
        });
      }catch(ex){reject(ex.message||String(ex));}
    };
    reader.readAsArrayBuffer(file);
  });
}

async function handleUpload(){
  const label=document.getElementById('up-label')?.value?.trim(),file=document.getElementById('up-file')?.files?.[0];
  if(!label){setStatus('Escribe una etiqueta','err');return;}
  if(!file){setStatus('Selecciona un Excel','err');return;}
  const btn=document.getElementById('up-btn');btn.disabled=true;btn.textContent='Leyendo Excel...';setStatus('Procesando...','info');
  try{
    const parsed=await parseExcelData(file);
    btn.textContent='Subiendo...';setStatus('Guardando en Supabase...','info');
    if(currentData.labels) parsed.labels=currentData.labels;
    const{error}=await supa.from('cierre_versiones').insert({dashboard_id:DASHBOARD_ID,version_label:label,uploaded_by:userSession.user.email,data:parsed,is_active:true});
    if(error)throw new Error(error.message);
    currentData=parsed;activeVerId=null;usingLive=true;renderAll();
    document.getElementById('ver-indicator').textContent=label;
    document.getElementById('ver-live').style.display='block';
    await loadVersionHistory();setStatus('Version "'+label+'" subida y activada.','ok');
    btn.textContent='Subir y activar';btn.disabled=false;document.getElementById('up-file').value='';
    setTimeout(()=>renderAdminPanel(),1500);
  }catch(ex){setStatus('Error: '+(ex.message||String(ex)),'err');btn.textContent='Subir y activar';btn.disabled=false;}
}

/* ===== INIT ===== */
async function init(){
  if(!supa){
    // Sin Supabase no hay forma de autenticar: no se muestra nada.
    mostrarGate('Configuracion incompleta: no hay conexion con el servidor.');
    return;
  }
  const {data:{session:s0}} = await supa.auth.getSession();
  if(s0){ userSession=s0; await arrancarSesion(); }
  else   { mostrarGate(''); }
}

init();
</script>
