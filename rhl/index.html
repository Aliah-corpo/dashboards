async function handleAbsorcionUpload(){
  const file = document.getElementById('abs-file')?.files?.[0];
  const preciosFile = document.getElementById('abs-precios-file')?.files?.[0];
  if(!file){ setAbsStatus('Selecciona al menos el archivo MEGASEMBRADO','err'); return; }

  const btn = document.getElementById('abs-upload-btn');
  const prog = document.getElementById('abs-progress');
  const progFill = document.getElementById('abs-progress-fill');
  if(btn){ btn.disabled=true; btn.textContent='Leyendo Excel...'; }
  if(prog) prog.classList.add('on');
  if(progFill) progFill.style.width='10%';
  setAbsStatus('Procesando MEGASEMBRADO (puede tardar 15-30s)...','info');

  try {
    if(progFill) progFill.style.width='20%';
    let parsed = await parseMegasembrado(file);

    /* Si hay lista de precios, parsear y mergear */
    if(preciosFile){
      if(progFill) progFill.style.width='40%';
      setAbsStatus('Procesando Lista de Precios...','info');
      const precios = await parseListaPrecios(preciosFile);
      if(progFill) progFill.style.width='55%';
      setAbsStatus('Cruzando datos ('+parsed.unidades.length+' unidades x '+precios.count+' precios)...','info');
      parsed = mergeAbsorcionConPrecios(parsed, precios);
    }

    /* Generar flujos de liquidacion a escritura usando fechas de columna BM */
    if(progFill) progFill.style.width='65%';
    setAbsStatus('Generando flujos de liquidacion (fechas de columna BM)...','info');
    parsed = generarFlujosLiquidacion(parsed);

    if(progFill) progFill.style.width='75%';
    setAbsStatus('Guardando en Supabase...','info');

    currentData.absorcion = parsed;

    if(progFill) progFill.style.width='90%';
    await guardarAbsorcion('Carga: '+file.name+(preciosFile?' + '+preciosFile.name:'')+' ('+parsed.unidades.length+' uds)');

    if(progFill) progFill.style.width='100%';
    renderAbsorcion();
    const statsMsg = parsed.mergeStats
      ? ` — Cruce: ${parsed.mergeStats.matched} OK, ${parsed.mergeStats.priceDiffs} difs de precio, ${parsed.mergeStats.soloMega} sin precio`
      : '';
    const fs = parsed.flujosStats;
    const flujosMsg = parsed.flujosGenerados
      ? ` — Flujos: ${fs?.conFecha||0} con fecha, ${fs?.sinFecha||0} sin fecha, ${fs?.yaLiquidados||0} ya liquidados`
      : '';
    setAbsStatus('Procesado: '+parsed.unidades.length+' unidades.'+statsMsg+flujosMsg,'ok');
  } catch(ex){
    setAbsStatus('Error: '+(ex.message||String(ex)),'err');
  }

  if(btn){ btn.disabled=false; btn.textContent='Procesar Archivos'; }
  setTimeout(()=>{ if(prog) prog.classList.remove('on'); }, 2000);
}

let corteActivo   = null;   // fecha_corte del dato en pantalla (YYYY-MM-DD)
let corteVigente  = null;   // el mas reciente disponible
let cortesCache   = [];
let enHistorico   = false;

function fmtFechaLarga(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const MES=['enero','febrero','marzo','abril','mayo','junio','julio',
             'agosto','septiembre','octubre','noviembre','diciembre'];
  return `${d} de ${MES[m-1]} de ${y}`;
}

function pintarBannerCorte(){
  const b = document.getElementById('corte-banner');
  const r = document.getElementById('corte-reset');
  if(!b) return;
  if(enHistorico && corteActivo){
    b.classList.add('on');
    b.innerHTML = `Viendo el corte al <b>${fmtFechaLarga(corteActivo)}</b>. `
                + `No es el dato vigente y la edicion esta desactivada. `
                + `<a href="#" onclick="resetCorte();return false;" style="color:var(--brass-dark);font-weight:700">Volver al vigente</a>`;
    if(r) r.style.display='inline-block';
  } else {
    b.classList.remove('on');
    if(r) r.style.display='none';
  }
}

async function cargarCortes(){
  if(!supa) return [];
  try{
    const {data} = await supa.from('cierre_versiones')
      .select('fecha_corte,version_label')
      .eq('dashboard_id',DASHBOARD_ID)
      .order('fecha_corte',{ascending:false});
    cortesCache = data||[];
    if(cortesCache.length){
      corteVigente = cortesCache[0].fecha_corte;
      const inp = document.getElementById('corte-input');
      if(inp){
        inp.value = corteVigente;
        inp.max   = corteVigente;
        const mas_viejo = cortesCache[cortesCache.length-1].fecha_corte;
        inp.min = mas_viejo;
      }
    }
    return cortesCache;
  }catch(e){ return []; }
}

async function onCorteChange(){
  const inp = document.getElementById('corte-input');
  if(!inp || !inp.value || !supa) return;
  const f = inp.value;
  try{
    const {data,error} = await supa.rpc('cierre_a_fecha',
      {p_dashboard:DASHBOARD_ID, p_fecha:f});
    if(error || !data || !data.length){
      setCorteAviso(`No hay ningun corte anterior al ${fmtFechaLarga(f)}.`);
      return;
    }
    const v = data[0];
    faltantesRellenados=[];
    currentData  = rellenarFaltantes(v.data, EMBEDDED_DATA);
    corteActivo  = v.fecha_corte;
    enHistorico  = (v.fecha_corte !== corteVigente);
    document.getElementById('ver-indicator').textContent = v.version_label;
    pintarBannerCorte();
    renderAll();
  }catch(e){ console.warn('Error al consultar corte:',e); }
}

function setCorteAviso(msg){
  const b=document.getElementById('corte-banner');
  if(!b)return;
  b.classList.add('on');
  b.innerHTML = msg + ` <a href="#" onclick="resetCorte();return false;" style="color:var(--brass-dark);font-weight:700">Volver al vigente</a>`;
}

async function resetCorte(){
  const inp=document.getElementById('corte-input');
  if(inp && corteVigente) inp.value = corteVigente;
  enHistorico=false; corteActivo=corteVigente;
  pintarBannerCorte();
  await loadActiveVersion();
  renderAll();
}

function buildConsLogrado(){
  const le1 = currentData.logrado?.e1;
  const le2 = currentData.logrado?.e2;
  if(!le1 && !le2) return null;
  const result = {};
  for(const mes of ['jun','jul']){
    const a = le1?.[mes], b = le2?.[mes];
    if(!a && !b) continue;
    const lg = {}, pl = {};
    const keys = new Set([
      ...Object.keys(a?.logrado||{}),
      ...Object.keys(b?.logrado||{})
    ]);
    keys.forEach(k => {
      lg[k] = (a?.logrado?.[k]||0) + (b?.logrado?.[k]||0);
      pl[k] = (a?.porLograr?.[k]||0) + (b?.porLograr?.[k]||0);
    });
    /* Absorcion consolidada: concatenar torres de ambas etapas */
    let absConsolidada = null;
    const absA = a?.absorcion, absB = b?.absorcion;
    if(absA || absB){
      absConsolidada = { torres: [...(absA?.torres||[]), ...(absB?.torres||[])] };
    }
    result[mes] = { logrado: lg, porLograr: pl, absorcion: absConsolidada };
  }
  return Object.keys(result).length ? result : null;
}

        const totals = {valorProyecto:0,cobrado:0,porCobrarTiempo:0,vencido:0,porLograr:0};
        for(const t of torres){
          const editable = puedeEditar() ? ' contenteditable="true" style="text-align:right;padding:6px 10px;border-bottom:1px solid var(--border);cursor:text;outline:none" onblur="saveAbsTorre(this,\''+id+'\',\''+mes+'\',\''+t.torre+'\')"' : ' style="text-align:right;padding:6px 10px;border-bottom:1px solid var(--border)"';
          torresHtml += `<tr>
            <td style="text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);font-weight:600">Torre ${t.torre}</td>
            <td data-abs-field="valorProyecto"${editable}>${fmtFull(t.valorProyecto)}</td>
            <td data-abs-field="cobrado"${editable}>${fmtFull(t.cobrado)}</td>
            <td data-abs-field="porCobrarTiempo"${editable}>${fmtFull(t.porCobrarTiempo)}</td>
            <td data-abs-field="vencido"${editable}>${fmtFull(t.vencido)}</td>
            <td data-abs-field="porLograr"${editable}>${fmtFull(t.porLograr)}</td>
          </tr>`;
          for(const k of Object.keys(totals)) totals[k] += (t[k]||0);
        }
        /* Total row */
        torresHtml += `<tr style="background:rgba(164,172,140,.08);font-weight:700">
          <td style="text-align:left;padding:6px 10px;font-size:11px">Total</td>
          <td style="text-align:right;padding:6px 10px">${fmtFull(totals.valorProyecto)}</td>
          <td style="text-align:right;padding:6px 10px">${fmtFull(totals.cobrado)}</td>
          <td style="text-align:right;padding:6px 10px">${fmtFull(totals.porCobrarTiempo)}</td>
          <td style="text-align:right;padding:6px 10px">${fmtFull(totals.vencido)}</td>
          <td style="text-align:right;padding:6px 10px">${fmtFull(totals.porLograr)}</td>
        </tr>`;
        torresHtml += '</table>';
      }
      logradoHtml += `<div id="det-ing-${uid}" style="display:none;padding-left:18px;border-left:2px solid var(--border);margin-left:4px">${torresHtml}</div>`;

      /* ——— 2. HARD COST (colapsable) ——— */
      logradoHtml += `<div style="cursor:pointer" onclick="document.getElementById('det-hc-${uid}').style.display=document.getElementById('det-hc-${uid}').style.display==='none'?'block':'none'">`;
      logradoHtml += barra('Hard Cost', lgHC, expHC, 'var(--charcoal)', 28, 13);
      logradoHtml += `</div>`;
      /* Totales HC siempre visibles */
      logradoHtml += `<div style="display:flex;flex-wrap:wrap;gap:16px;font-size:11px;color:var(--muted);margin:-4px 0 6px;padding:0 2px">
        <span>Ejercido: <b style="color:var(--charcoal)">${fmtCur(lgHC)}</b></span>
        <span>Pendiente: <b style="color:var(--charcoal)">${fmtCur(expHC - lgHC)}</b></span>
        <span>CPC: <b style="color:var(--charcoal)">${fmtCur(d.cpc?.[last]||0)}</b></span>
        <span style="cursor:pointer;color:var(--brass-dark);font-weight:600" onclick="document.getElementById('det-hc-${uid}').style.display=document.getElementById('det-hc-${uid}').style.display==='none'?'block':'none'">&#9662; detalle</span>
      </div>`;
      logradoHtml += `<div id="det-hc-${uid}" style="display:none;padding-left:18px;border-left:2px solid var(--border);margin-left:4px">
        <div style="font-size:12px;color:var(--muted);padding:8px 0">
          <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)"><span>Construccion</span><span style="font-weight:600">${fmtCur(lg.costoObra||0)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Contratos por cerrar</span><span style="font-weight:600">${fmtCur(d.cpc?.[last]||0)}</span></div>
        </div>
      </div>`;

      /* ——— 3. SOFT COST + sub-barras (siempre visibles) ——— */
      logradoHtml += barra('Soft Cost', lgSC, expSC, 'var(--green)', 28, 13);
      /* Totales SC siempre visibles */
      logradoHtml += `<div style="display:flex;flex-wrap:wrap;gap:16px;font-size:11px;color:var(--muted);margin:-4px 0 6px;padding:0 2px">
        <span>SC1 Operativos: <b style="color:var(--charcoal)">${fmtCur(expSC1)}</b></span>
        <span>SC2 Comercializacion: <b style="color:var(--charcoal)">${fmtCur(expSC2)}</b></span>
        <span>SC3 Financieros: <b style="color:var(--charcoal)">${fmtCur(expSC3)}</b></span>
      </div>`;
      logradoHtml += `<div style="padding-left:18px;border-left:2px solid var(--border);margin-left:4px">`;
      logradoHtml += barra('Gastos Operativos (SC1)', lgSC1, expSC1, 'var(--sage)', 14, 11);
      logradoHtml += barra('Gastos de Comercializacion (SC2)', lgSC2, expSC2, 'var(--sage)', 14, 11);
      logradoHtml += barra('Gastos Financieros (SC3)', lgSC3, expSC3, 'var(--sage)', 14, 11);
      logradoHtml += `</div>`;

      /* ——— TERMOMETRO DE RIESGO ——— */
      /* Criterio 1: Convergencia — % de costo total ya ejercido */
      const pctConvergencia = expCostoTotal ? Math.min(100, (lgCostoTotal / expCostoTotal) * 100) : 0;
      const pctPendiente = 100 - pctConvergencia;

      /* Criterio 2: Volatilidad — desviacion entre escenarios historicos */
      const utilSeries = d.utilidadNeta || [];
      let volPct = 0, rangoMin = 0, rangoMax = 0;
      if(utilSeries.length > 2){
        const cambios = [];
        for(let j=1;j<utilSeries.length;j++){
          if(utilSeries[j-1] && utilSeries[j-1]!==0)
            cambios.push(Math.abs((utilSeries[j]-utilSeries[j-1])/utilSeries[j-1])*100);
        }
        volPct = cambios.length ? cambios.reduce((a,b)=>a+b,0)/cambios.length : 0;
        const utilActual = utilSeries[utilSeries.length-1]||0;
        rangoMin = utilActual * (1 - volPct/100);
        rangoMax = utilActual * (1 + volPct/100);
      }

      /* Criterio 3: Tendencia costos — % aumento mensual promedio del costo pendiente */
      const costoSeries = (d.costoObra||[]).map((v,j)=>
        (v||0) + (d.totalGastosOperativos?.[j]||0) + (d.totalGastosComercializacion?.[j]||0) + (d.totalGastosFinancieros?.[j]||0));
      let tendPct = 0, utilAjustada = 0;
      if(costoSeries.length > 2){
        const cambiosCosto = [];
        for(let j=1;j<costoSeries.length;j++){
          if(costoSeries[j-1] && costoSeries[j-1]!==0)
            cambiosCosto.push(((costoSeries[j]-costoSeries[j-1])/costoSeries[j-1])*100);
        }
        tendPct = cambiosCosto.length ? cambiosCosto.reduce((a,b)=>a+b,0)/cambiosCosto.length : 0;
        const pendiente = expCostoTotal - lgCostoTotal;
        const costoAjustado = lgCostoTotal + pendiente * (1 + tendPct/100);
        utilAjustada = (d.ingresos?.[last]||0) - costoAjustado - (d.totalCostoTierra?.[last]||0);
      }

      const utilActual = d.utilidadNeta?.[last]||0;

      logradoHtml += `
      <div style="margin-top:20px;padding:16px 20px;background:rgba(72,77,49,.04);border:1px solid var(--border);border-radius:12px">
        <p style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);margin:0 0 12px">Termometro de Riesgo — Utilidad Neta ${fmtCur(utilActual)}</p>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
          <div style="padding:12px;background:var(--white);border-radius:8px;border:1px solid var(--border)">
            <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px">Convergencia</p>
            <p style="font-size:22px;font-weight:700;font-family:'Outfit',sans-serif;margin:0;color:var(--charcoal)">${pctConvergencia.toFixed(0)}%</p>
            <p style="font-size:11px;color:var(--muted);margin:4px 0 0">del costo ya ejercido</p>
            <p style="font-size:11px;color:var(--olive);font-weight:600;margin:4px 0 0">Solo ${pctPendiente.toFixed(1)}% puede desviarse</p>
          </div>
          <div style="padding:12px;background:var(--white);border-radius:8px;border:1px solid var(--border)">
            <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px">Volatilidad historica</p>
            <p style="font-size:22px;font-weight:700;font-family:'Outfit',sans-serif;margin:0;color:var(--charcoal)">${volPct>0?volPct.toFixed(0)+'%':'--'}</p>
            <p style="font-size:11px;color:var(--muted);margin:4px 0 0">desviacion promedio entre cortes</p>
            <p style="font-size:11px;color:var(--olive);font-weight:600;margin:4px 0 0">${volPct>0?'Rango: '+fmtCur(rangoMin)+' — '+fmtCur(rangoMax):'Sin datos suficientes'}</p>
          </div>
          <div style="padding:12px;background:var(--white);border-radius:8px;border:1px solid var(--border)">
            <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px">Tendencia de costos</p>
            <p style="font-size:22px;font-weight:700;font-family:'Outfit',sans-serif;margin:0;color:${tendPct>0?'var(--error)':'var(--green)'}">${tendPct!==0?(tendPct>0?'+':'')+tendPct.toFixed(1)+'%':'--'}</p>
            <p style="font-size:11px;color:var(--muted);margin:4px 0 0">aumento mensual promedio</p>
            <p style="font-size:11px;color:var(--olive);font-weight:600;margin:4px 0 0">${utilAjustada?'Si sigue: '+fmtCur(utilAjustada):'Sin datos suficientes'}</p>
          </div>
        </div>
      </div>`;

      logradoHtml+='</div>';
    }
    logradoHtml+='</div></div>';
  }

  /* Scenario chips */
  let filtersHtml = '';
  if(scenarios.length > 1){
    filtersHtml='<div class="scen-filters"><span class="scen-filters-label">Escenarios:</span>';
    for(let i=1;i<scenarios.length;i++){
      const hidden=_hiddenCols[id]?.has(i);
      filtersHtml+=`<button class="scen-chip${hidden?'':' active'}" data-col="${i}" onclick="toggleScenCol('${id}',${i},this)">${scenarios[i]}</button>`;
    }
    filtersHtml+='</div>';
  }

  /* Tabla */
  let tblHtml=`<div class="tbl-wrap"><table class="data" id="tbl-${id}"><thead><tr><th>Concepto</th>`;
  for(let i=0;i<scenarios.length;i++)
    tblHtml+=`<th>${scenarios[i]}${i===0?' <span style="opacity:.4;font-weight:400;font-size:10px">(Base)</span>':''}</th>`;
  tblHtml+='</tr></thead><tbody>';

  let curSec = null;

  const ROWS = construirROWS();
  for(const row of ROWS){
    if(row.type==='section'){
      curSec=row.key;
      const collapsed=(_secStates[id+'_'+row.key]!==true);
      const lbl = currentData.labels?.[row.key] || currentData.scLabels?.[row.key] || row.label;
      const scTag = row.sc ? `<span class="sc-tag">${row.sc}</span>` : '';
      /* Total de la seccion — siempre visible en el header */
      const SEC_TOTALS = {
        '_sepIng':'ingresos','_sepHC':'sumaHC',
        '_sep1':'totalGastosOperativos','_sep2':'totalGastosComercializacion',
        '_sep3':'totalGastosFinancieros','_sep4':'totalCostoTierra',
        '_sep45':'porRecuperar','_sep5':'utilidadNeta'
      };
      const totalKey = SEC_TOTALS[row.key];
      let totalHtml = '';
      if(totalKey && d[totalKey]){
        const rawVal = d[totalKey][last];
        if(rawVal !== undefined){
          const isExp = totalKey !== 'porRecuperar' && totalKey !== 'utilidadNeta' && totalKey !== 'ingresos';
          const displayVal = (isExp && rawVal > 0) ? -rawVal : rawVal;
          totalHtml = `<span style="float:right;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;color:${displayVal<0?'var(--error)':'var(--charcoal)'};letter-spacing:0">${fmtFull(displayVal)}</span>`;
        }
      }
      let secHdrCells = '';
      if(scenarios.length > 1 && totalHtml){
        secHdrCells = `<td colspan="${scenarios.length}"><span class="sec-arrow">${collapsed?'&#9658;':'&#9660;'}</span>${lbl}${scTag}</td><td style="text-align:right;background:rgba(164,172,140,.12)">${totalHtml}</td>`;
      } else {
        secHdrCells = `<td colspan="${scenarios.length+1}"><span class="sec-arrow">${collapsed?'&#9658;':'&#9660;'}</span>${lbl}${scTag}${totalHtml}</td>`;
      }
      tblHtml+=`<tr class="section-hdr" data-sec-hdr="${row.key}" onclick="toggleSection('${id}','${row.key}',this)">${secHdrCells}</tr>`;
      continue;
    }

    if(row.standalone) curSec=null;
    const trCls=row.type==='total'?'row-total':row.type==='hero'?'row-hero':row.type==='pct'?'row-pct':row.type==='expandable'?'row-expandable':'';
    const secAttr=curSec?` data-sec="${curSec}"`:'';
    const secHidden=(curSec && _secStates[id+'_'+curSec]!==true)?' style="display:none"':'';
    let onclk='';
    if(row.type==='expandable') onclk=` onclick="toggleDetail(this,'${id}','${row.key}')"`;

    const provCls = row.esProvision ? ' provision' : '';
    tblHtml+=`<tr class="${trCls}${provCls}"${secAttr}${secHidden}${onclk}>`;
    /* Label cell */
    const lbl = currentData.labels?.[row.key] || row.label;
    const formulaDrivenNote = row.formulaDriven ? ' <span style="font-size:9px;opacity:.5;font-style:italic">fórmula</span>' : '';
    const chipEst = row.esProvision ? '<span class="chip-est">estimado</span>' : '';
    const chipNue = row.esNueva ? '<span class="chip-nueva">nueva</span>' : '';
    const btnQuitar = (isAdmin && !enHistorico && row.type==='data' && !row.esProvision)
      ? `<button class="row-x" title="Quitar partida" onclick="event.stopPropagation();quitarPartida('${row.key}',${JSON.stringify(lbl).replace(/"/g,'&quot;')})">&#10005;</button>` : '';
    tblHtml+=`<td data-rowkey="${row.key}">${lbl}${formulaDrivenNote}${chipEst}${chipNue}${btnQuitar}</td>`;

    for(let i=0;i<scenarios.length;i++){
      const rawVal=d[row.key]?.[i];
      if(rawVal===undefined){tblHtml+='<td>-</td>';continue;}
      const displayVal=(row.isExpense&&rawVal>0)?-rawVal:rawVal;
      const formatted=row.fmt(displayVal);
      const isNeg=displayVal<0;
      let deltaHtml='';
      if(i>0&&!row.noDelta){
        const baseRaw=d[row.key]?.[0];
        if(baseRaw!==undefined&&baseRaw!==0){
          const pctDiff=((rawVal-baseRaw)/Math.abs(baseRaw))*100;
          if(Math.abs(pctDiff)>=0.05){
            const up=pctDiff>0;
            const cls=row.isExpense?(up?'dp-exp':'dn-exp'):(up?'dp':'dn');
            deltaHtml=`<span class="delta-chip ${cls}">${up?'&#9650;':'&#9660;'} ${up?'+':''}${pctDiff.toFixed(1)}%</span>`;
          }
        }
      }
      /* Admin numeric editing — last column only, for editable keys */
      const isEditableCell = isAdmin && i===last && EDITABLE_KEYS.has(row.key);
      const numAttr = isEditableCell ? ` data-num-key="${row.key}" data-tab="${id}" data-col="${i}"` : '';
      const rawDisplay = isEditableCell ? rawVal : null;
      const dataRaw = rawDisplay!==null ? ` data-raw="${rawVal}"` : '';
      tblHtml+=`<td${numAttr}${dataRaw}><div class="val-cell${isNeg?' val-neg':''}"><span class="fmt-val">${formatted}</span>${deltaHtml}</div></td>`;
    }
    tblHtml+='</tr>';

    /* Detalle: devolucion */
    if(row.key==='devolucion'){
      for(const det of DEVOL_DETAIL){
        tblHtml+=`<tr class="detail-row"${secAttr}${secHidden} data-parent="devolucion-${id}"><td data-rowkey="${det.key}">${currentData.labels?.[det.key]||det.label}</td>`;
        for(let i=0;i<scenarios.length;i++){
          const v=d[det.key]?.[i];
          tblHtml+=v!=null?`<td>${fmtFull(v)}</td>`:'<td>-</td>';
        }
        tblHtml+='</tr>';
      }
    }
  }
  tblHtml+='</tbody></table></div>';
  if(isAdmin && !enHistorico){
    const nOcultas=(currentData.hiddenRows||[]).length;
    tblHtml+=`<button class="add-partida" onclick="agregarPartida()">+ Agregar partida</button>`;
    if(nOcultas) tblHtml+=`<span style="font-size:12px;color:var(--muted);margin-left:14px">`
      +`${nOcultas} partida${nOcultas>1?'s':''} oculta${nOcultas>1?'s':''} &mdash; `
      +`<a href="#" onclick="openAdmin();return false;" style="color:var(--brass-dark);font-weight:600">restaurar</a></span>`;
  }

  /* Vertientes (solo E1) */
  let vertientesHtml = '';
  if(id === 'e1' && currentData.vertientes){
    const vt = currentData.vertientes;
    const vtOpen = _secStates['vertientes'] === true;
    vertientesHtml = `<div class="vertientes-wrap"><div class="vertientes-toggle" onclick="toggleVertientes()"><span class="sec-arrow" id="vert-arrow">${vtOpen?'&#9660;':'&#9658;'}</span>E1 — Dos Vertientes de Analisis (Julio 2026)</div><div class="vertientes-body${vtOpen?' open':''}" id="vertientes-body"><div class="vertientes-grid">`;
    for(const vKey of ['e1','cons']){
      const vd = vt[vKey];
      if(!vd) continue;
      vertientesHtml += `<div class="vertiente-card"><h3>${vKey==='e1'?'Etapa 1 — Vision Independiente':'Consolidado E1 + E2'}</h3>`;
      vertientesHtml += `<div class="vertiente-row highlight"><span class="label">Utilidad Neta</span><span class="value">${fmtCur(vd.utilidadNeta)}</span></div>`;
      vertientesHtml += `<div class="vertiente-row"><span class="label">Devolucion Total</span><span class="value">${fmtCur(vd.devolucion)}</span></div>`;
      vertientesHtml += `<div class="vertiente-row"><span class="label">Margen</span><span class="value">${fmtPct(vd.margen)}</span></div>`;
      vertientesHtml += `<div class="vertiente-row"><span class="label">Multiplo</span><span class="value">${fmtMult(vd.multiplo)}</span></div>`;
      vertientesHtml += `<div class="vertiente-row"><span class="label">TIR</span><span class="value">${fmtPct(vd.tir)}</span></div>`;
      vertientesHtml += '</div>';
    }
    vertientesHtml += '</div></div></div>';
  }

  panel.innerHTML = bannerHtml + heroHtml + equityHtml + chartsHtml + logradoHtml + filtersHtml + tblHtml + vertientesHtml;

  restoreColStates(id);
  renderLineChart(cid1, scenarios, d.ingresos,     'Ingresos',      '--brass');
  renderLineChart(cid2, scenarios, d.utilidadNeta, 'Utilidad Neta', '--olive');
}

/* ===== COMPARADOR DE MESES ===== */
function renderComparador(tabId){
  const sel = document.getElementById('comp-sel-'+tabId);
  const container = document.getElementById('comp-bars-'+tabId);
  if(!sel || !container) return;
  const idx = sel.value;
  if(idx === ''){ container.innerHTML = ''; return; }
  const si = parseInt(idx);
  const tab = currentData[tabId];
  if(!tab) return;
  const d = tab.data;
  const last = tab.scenarios.length - 1;
  const labelAntes = tab.scenarios[si];
  const labelActual = tab.scenarios[last];

  function compBarra(lbl, valAntes, valActual, color){
    const maxVal = Math.max(Math.abs(valAntes), Math.abs(valActual)) || 1;
    const pctA = (Math.abs(valAntes)/maxVal)*100;
    const pctB = (Math.abs(valActual)/maxVal)*100;
    const delta = valAntes ? ((valActual - valAntes)/Math.abs(valAntes)*100) : 0;
    const deltaColor = delta > 0 ? 'var(--green)' : 'var(--error)';
    return `<div style="margin:10px 0">
      <div style="font-size:12px;font-weight:700;margin-bottom:4px">${lbl}
        <span style="font-size:11px;font-weight:600;color:${deltaColor};margin-left:8px">${delta>0?'+':''}${delta.toFixed(1)}%</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
        <span style="font-size:10px;color:var(--muted);min-width:90px">${labelAntes}</span>
        <div style="flex:1;height:16px;background:var(--border);border-radius:4px;overflow:hidden">
          <div style="width:${pctA.toFixed(1)}%;height:100%;background:${color};opacity:.5;border-radius:4px"></div>
        </div>
        <span style="font-size:11px;font-weight:600;min-width:80px;text-align:right">${fmtCur(valAntes)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;color:var(--muted);min-width:90px">${labelActual}</span>
        <div style="flex:1;height:16px;background:var(--border);border-radius:4px;overflow:hidden">
          <div style="width:${pctB.toFixed(1)}%;height:100%;background:${color};border-radius:4px"></div>
        </div>
        <span style="font-size:11px;font-weight:600;min-width:80px;text-align:right">${fmtCur(valActual)}</span>
      </div>
    </div>`;
  }

  /* Calcular SC totales para ambos escenarios */
  const sc1A = ['gestionLicencias','contratistaGeneral','indirectoCorp','gastosOpObra','proyectoEjecutivo','activosFijos','legal','sat'].reduce((s,k)=>s+(d[k]?.[si]||0),0);
  const sc2A = (d.publicidad?.[si]||0)+(d.comisionComercializacion?.[si]||0);
  const sc3A = (d.interesesBX?.[si]||0)+(d.comisionAperturaBX?.[si]||0)+(d.otrosGastosFin?.[si]||0);
  const sc1B = ['gestionLicencias','contratistaGeneral','indirectoCorp','gastosOpObra','proyectoEjecutivo','activosFijos','legal','sat'].reduce((s,k)=>s+(d[k]?.[last]||0),0);
  const sc2B = (d.publicidad?.[last]||0)+(d.comisionComercializacion?.[last]||0);
  const sc3B = (d.interesesBX?.[last]||0)+(d.comisionAperturaBX?.[last]||0)+(d.otrosGastosFin?.[last]||0);

  let html = `<div style="padding:16px 20px;background:rgba(176,141,87,.06);border:1px solid var(--border);border-radius:12px;margin-bottom:18px">
    <p style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-dark);margin:0 0 10px">Comparador: ${labelAntes} vs ${labelActual}</p>`;
  html += compBarra('Ingresos', d.ingresos?.[si]||0, d.ingresos?.[last]||0, 'var(--olive)');
  html += compBarra('Hard Cost', d.costoObra?.[si]||0, d.costoObra?.[last]||0, 'var(--charcoal)');

/* ===== HELPERS ===== */
function getDelta(curr,base,isExpense){
  if(!base||base===0)return{text:'-',cls:''};
  const d=((curr-base)/Math.abs(base))*100,up=d>=0,good=isExpense?!up:up;
  return{text:(up?'+':'')+d.toFixed(1)+'%',cls:good?'pos':'neg'};
}

function activateNumericEditing(){
  if(!puedeEditar()) return;
  document.querySelectorAll('td[data-num-key]').forEach(td=>{
    if(td.getAttribute('contenteditable')==='true') return;
    td.setAttribute('contenteditable','true');
    td.title='Clic para editar cifra — Enter para recalcular';
    const fmtSpan=td.querySelector('.fmt-val');

    td.addEventListener('focus',()=>{
      /* Show raw number for editing */
      const raw=parseFloat(td.dataset.raw||'0');
      if(fmtSpan) fmtSpan.textContent=raw.toFixed(2);
      td.querySelector('.delta-chip')?.remove();
    });

    td.addEventListener('blur',()=>{
      const raw=td.querySelector('.fmt-val')?.textContent||td.textContent;
      const num=parseFloat(String(raw).replace(/[$,()\s]/g,''));
      if(!isNaN(num)){
        const key=td.dataset.numKey, tabKey=td.dataset.tab, colIdx=parseInt(td.dataset.col);
        td.dataset.raw=num;
        const antes = currentData[tabKey].data[key][colIdx];
        currentData[tabKey].data[key][colIdx]=num;
        recalculate(tabKey);
        recalculate('cons');            // el consolidado se deriva de E1+E2
        updateTabDisplay(tabKey);
        updateTabDisplay('cons');
        const esc = currentData[tabKey].scenarios[colIdx];
        bitacora(tabKey,'cifra',key,antes,num,esc,null);
        scheduleNumericSave(tabKey);
      }
    });

    td.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();td.blur();}
      /* Allow: numbers, dot, minus, backspace, arrows, del */
      if(!/[\d.\-]/.test(e.key)&&!['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(e.key)&&!e.metaKey&&!e.ctrlKey){
        e.preventDefault();
      }
    });
  });
}

/* Update displayed values after recalc without full re-render */
function updateTabDisplay(tabKey){
  const tab = currentData[tabKey];
  if(!tab) return;
  const d = tab.data;
  const last = tab.scenarios.length - 1;

  /* Update hero tiles */
  const hUtil=document.getElementById(`hero-util-${tabKey}`);
  const hMrg=document.getElementById(`hero-margen-${tabKey}`);
  const hTir=document.getElementById(`hero-tir-${tabKey}`);
  const hMlt=document.getElementById(`hero-mult-${tabKey}`);
  if(hUtil) hUtil.textContent=fmtCur(d.utilidadNeta?.[last]);
  if(hMrg) hMrg.textContent=fmtPct(d.margen?.[last]);
  if(hTir) hTir.textContent=fmtPct(d.tir?.[last]);
  if(hMlt) hMlt.textContent=fmtMult(d.multiplo?.[last]);

  /* Update all numeric cells in this tab */
  const colLast = last;
  document.querySelectorAll(`#panel-${tabKey} table.data tbody tr`).forEach(tr=>{
    /* Get row key from first td */
    const firstTd = tr.querySelector('td[data-rowkey]');
    if(!firstTd) return;
    const key = firstTd.dataset.rowkey;
    if(!key||key.startsWith('_')) return;
    const row = construirROWS().find(r=>r.key===key);
    if(!row||!row.fmt) return;
    /* Update last column cell */
    const cells = tr.querySelectorAll('td');
    const targetCell = cells[colLast+1]; /* +1 for label col */
    if(!targetCell) return;
    const rawVal = d[key]?.[last];
    if(rawVal===undefined) return;
    const displayVal=(row.isExpense&&rawVal>0)?-rawVal:rawVal;
    const formatted = row.fmt(displayVal);
    const fmtSpan = targetCell.querySelector('.fmt-val');
    if(fmtSpan) fmtSpan.textContent=formatted;
    targetCell.dataset.raw=rawVal;
    /* Toggle neg class */
    const valCell=targetCell.querySelector('.val-cell');
    if(valCell){ valCell.classList.toggle('val-neg',displayVal<0); }
  });

  /* Update chart */
  const chartIngresos=charts[tabKey+'_ing'], chartUtil=charts[tabKey+'_util'];
  if(chartIngresos){ chartIngresos.data.datasets[0].data=d.ingresos; chartIngresos.update(); }
  if(chartUtil){ chartUtil.data.datasets[0].data=d.utilidadNeta; chartUtil.update(); }
}

/* ===== ABSORCION POR TORRE: guardar edicion inline ===== */
function saveAbsTorre(td, tabId, mes, torre){
  if(!puedeEditar()) return;
  const field = td.dataset.absField;
  const raw = td.textContent.replace(/[$,\s()]/g,'');
  const num = parseFloat(raw);
  if(isNaN(num)){ td.textContent = '$0'; return; }
  td.textContent = fmtFull(num);
  // Guardar en currentData
  if(!currentData.logrado) currentData.logrado = {};
  if(!currentData.logrado[tabId]) currentData.logrado[tabId] = {};
  if(!currentData.logrado[tabId][mes]) currentData.logrado[tabId][mes] = {logrado:{},porLograr:{},absorcion:{torres:[]}};
  if(!currentData.logrado[tabId][mes].absorcion) currentData.logrado[tabId][mes].absorcion = {torres:[]};
  const torres = currentData.logrado[tabId][mes].absorcion.torres;
  let t = torres.find(x => x.torre === torre);
  if(!t){ t = {torre, valorProyecto:0, cobrado:0, porCobrarTiempo:0, vencido:0, porLograr:0}; torres.push(t); }
  t[field] = num;
  bitacora('logrado','absorcion',`${tabId}.${mes}.${torre}.${field}`,null,num,null,'Edicion absorcion por torre');
  scheduleNumericSave(tabId);
}

function editBreakdownMeta(){

  const hcPres = prompt('HC Presupuestado:', bd.hc?.pres||'');

  const hcEjer = prompt('HC Ejercido:', bd.hc?.ejer||'');

  const scPres = prompt('SC Presupuestado:', bd.sc?.pres||'');
  if(scPres === null) return;

  if(scEjer === null) return;
  const fecha = prompt('Fecha de corte (YYYY-MM-DD):', bd.fecha||new Date().toISOString().slice(0,10));
  if(fecha === null) return;

  const parse = s => parseFloat(String(s).replace(/[,$\s]/g,''))||0;
  bd.hc = {pres: parse(hcPres), ejer: parse(hcEjer)};
  bd.sc = {pres: parse(scPres), ejer: parse(scEjer)};
  bd.fecha = fecha.trim();
  currentData.breakdown = bd;
  guardarBreakdown('Edicion de cifras HC/SC');
  renderBreakdown();
  renderAdminPanel();
}

/* ===== 3 PARSERS DE EXCEL PARA BREAKDOWN ===== */

/* Parser 1: Hoja _DASHBOARD — formato estandar con columnas fijas */
function parseBkdDashboardSheet(wb){
  const XLSX = window.XLSX;
  const ws = wb.Sheets['_DASHBOARD'];
  if(!ws) return null;
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  if(rows.length < 5) return null;

  /* Estructura esperada:
     Fila 0: headers [Concepto, Monto, Grupo, Fuente]
     Filas 1+: partidas
     Ultima fila especial: presIni, hcPres, hcEjer, scPres, scEjer, fecha */
  const result = {partidas:[], presIni: BREAKDOWN_DEFAULT.presIni,
    hc:{pres:0,ejer:0}, sc:{pres:0,ejer:0}, fecha:''};

  for(let i=1; i<rows.length; i++){
    const r = rows[i]; if(!r) continue;
    const col0 = String(r[0]||'').trim().toLowerCase();

    /* Meta-rows */
    if(col0 === 'presini' || col0 === 'presupuesto inicial'){
      result.presIni = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||BREAKDOWN_DEFAULT.presIni;
      continue;
    }
    if(col0 === 'hc_pres' || col0 === 'hard cost presupuestado'){
      result.hc.pres = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||0; continue;
    }
    if(col0 === 'hc_ejer' || col0 === 'hard cost ejercido'){
      result.hc.ejer = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||0; continue;
    }
    if(col0 === 'sc_pres' || col0 === 'soft cost presupuestado'){
      result.sc.pres = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||0; continue;
    }
    if(col0 === 'sc_ejer' || col0 === 'soft cost ejercido'){
      result.sc.ejer = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||0; continue;
    }
    if(col0 === 'fecha' || col0 === 'fecha_corte'){
      result.fecha = String(r[1]||'').trim(); continue;
    }

    /* Partida normal */
    const name = String(r[0]||'').trim();
    const monto = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''));
    if(name && monto){
      const key = 'bkd_' + name.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,30) + '_' + i;
      const group = String(r[2]||'').trim().toLowerCase() === 'aliah' ? 'aliah' : undefined;
      const source = String(r[3]||'').trim() || 'Excel _DASHBOARD';
      result.partidas.push({key, name, monto: Math.abs(monto), group,
        detail:{source, items:[{name, monto: Math.abs(monto)}]}});
    }
  }
  return result.partidas.length ? result : null;
}

/* Parser 2: Hojas "Resumen Ejecutivo LV-E1 v2" + "Extras" */
function parseBkdResumenYExtras(wb){
  const XLSX = window.XLSX;
  /* Buscar hojas por nombre parcial */
  const sheetNames = wb.SheetNames;
  const resSheet = sheetNames.find(s => s.toLowerCase().includes('resumen ejecutivo') && s.toLowerCase().includes('e1'));
  const extSheet = sheetNames.find(s => s.toLowerCase().includes('extras') || s.toLowerCase().includes('extra'));
  if(!resSheet && !extSheet) return null;

  const result = {partidas:[], presIni: BREAKDOWN_DEFAULT.presIni,
    hc:{pres:0,ejer:0}, sc:{pres:0,ejer:0}, fecha:''};

  /* Del Resumen Ejecutivo extraer HC/SC */
  if(resSheet){
    const ws = wb.Sheets[resSheet];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
    for(const r of rows){
      const lbl = String(r?.[0]||'').toLowerCase().trim();
      if(!lbl) continue;
      if(lbl.includes('hard cost') && lbl.includes('presup')){
        result.hc.pres = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||0;
      }
      if(lbl.includes('hard cost') && lbl.includes('ejerc')){
        result.hc.ejer = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||0;
      }
      if(lbl.includes('soft cost') && lbl.includes('presup')){
        result.sc.pres = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||0;
      }
      if(lbl.includes('soft cost') && lbl.includes('ejerc')){
        result.sc.ejer = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||0;
      }
      if(lbl.includes('presupuesto inicial') || lbl.includes('pres. inicial')){
        result.presIni = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||BREAKDOWN_DEFAULT.presIni;
      }
      if(lbl.includes('fecha')){
        const v = r[1]; if(v) result.fecha = String(v).trim();
      }
    }
  }

  /* De la hoja Extras extraer partidas */
  if(extSheet){
    const ws = wb.Sheets[extSheet];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
    for(let i=0; i<rows.length; i++){
      const r = rows[i]; if(!r) continue;
      const name = String(r[0]||'').trim();
      if(!name || name.toLowerCase()==='concepto' || name.toLowerCase()==='total') continue;
      const monto = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''));
      if(!monto) continue;
      const key = 'bkd_ext_' + name.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,30) + '_' + i;
      const group = String(r[2]||'').trim().toLowerCase() === 'aliah' ? 'aliah' : undefined;
      result.partidas.push({key, name, monto: Math.abs(monto), group,
        detail:{source: 'Hoja Extras — ' + extSheet, items:[{name, monto: Math.abs(monto)}]}});
    }
  }

  return result.partidas.length || result.hc.pres ? result : null;
}

/* Parser 3: Hoja "Resumen E1" — formato legacy */
function parseBkdResumenE1(wb){
  const XLSX = window.XLSX;
  const sheetNames = wb.SheetNames;
  const target = sheetNames.find(s => {
    const lo = s.toLowerCase();
    return (lo.includes('resumen') && lo.includes('e1') && !lo.includes('ejecutivo'))
        || lo === 'resumen e1' || lo === 'resumen ppto e1';
  });
  if(!target) return null;

  const ws = wb.Sheets[target];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  if(rows.length < 3) return null;

  const result = {partidas:[], presIni: BREAKDOWN_DEFAULT.presIni,
    hc:{pres:0,ejer:0}, sc:{pres:0,ejer:0}, fecha:''};

  /* Estructura legacy: Col A=concepto, Col B=presupuestado, Col C=ejercido, Col D=variacion */
  for(let i=0; i<rows.length; i++){
    const r = rows[i]; if(!r) continue;
    const lbl = String(r[0]||'').toLowerCase().trim();
    if(!lbl) continue;

    if(lbl.includes('hard cost') && !lbl.includes('soft')){
      result.hc.pres = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||0;
      result.hc.ejer = parseFloat(String(r[2]||0).replace(/[,$\s]/g,''))||0;
      continue;
    }
    if(lbl.includes('soft cost')){
      result.sc.pres = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||0;
      result.sc.ejer = parseFloat(String(r[2]||0).replace(/[,$\s]/g,''))||0;
      continue;
    }
    if(lbl.includes('presupuesto inicial')){
      result.presIni = parseFloat(String(r[1]||0).replace(/[,$\s]/g,''))||BREAKDOWN_DEFAULT.presIni;
      continue;
    }

    /* Partidas: si col D (variacion) tiene dato, es una partida */
    const variacion = parseFloat(String(r[3]||0).replace(/[,$\s]/g,''));
    if(variacion && Math.abs(variacion) > 1000){
      const name = String(r[0]||'').trim();
      const key = 'bkd_leg_' + name.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,30) + '_' + i;
      result.partidas.push({key, name, monto: Math.abs(variacion),
        detail:{source: 'Hoja ' + target, items:[{name, monto: Math.abs(variacion)}]}});
    }
  }

  return result.partidas.length || result.hc.pres ? result : null;
}

/* Handler unificado: intenta los 3 parsers en orden de prioridad */
async function handleBreakdownExcel(){
  const fileInp = document.getElementById('bkd-excel-file');
  if(!fileInp || !fileInp.files[0]){
    setBkdStatus('Selecciona un archivo Excel primero.','err'); return;
  }
  const XLIBX = window.XLSX;
  if(!XLIBX){ setBkdStatus('SheetJS no disponible.','err'); return; }

  setBkdStatus('Procesando...','');
  const file = fileInp.files[0];
  try {
    const buf = await file.arrayBuffer();
    const wb = XLIBX.read(buf, {type:'array'});

    /* Intentar parsers en orden */
    let parsed = parseBkdDashboardSheet(wb);
    let src = '_DASHBOARD';
    if(!parsed){ parsed = parseBkdResumenYExtras(wb); src = 'Resumen Ejecutivo + Extras'; }
    if(!parsed){ parsed = parseBkdResumenE1(wb); src = 'Resumen E1 legacy'; }
    if(!parsed){
      setBkdStatus('No se encontro ninguna hoja reconocida (_DASHBOARD, Resumen Ejecutivo, Extras, Resumen E1).','err');
      return;
    }

    /* Merge: conservar partidas que ya existan con el mismo key */
    const bd = getBreakdownData();
    if(parsed.hc.pres) bd.hc = parsed.hc;
    if(parsed.sc.pres) bd.sc = parsed.sc;
    if(parsed.fecha) bd.fecha = parsed.fecha;
    if(parsed.presIni !== BREAKDOWN_DEFAULT.presIni) bd.presIni = parsed.presIni;

    /* Agregar partidas nuevas (no duplicar por nombre) */
    const existNames = new Set((bd.partidas||[]).map(p=>p.name.toLowerCase()));
    let added = 0;
    for(const p of parsed.partidas){
      if(!existNames.has(p.name.toLowerCase())){
        if(!bd.partidas) bd.partidas = [];
        bd.partidas.push(p);
        existNames.add(p.name.toLowerCase());
        added++;
      }
    }

    currentData.breakdown = bd;
    await guardarBreakdown('Import Excel (' + src + '): ' + file.name);
    renderBreakdown();
    renderAdminPanel();
    setBkdStatus(`Listo — parser: ${src}. ${parsed.partidas.length} partidas leidas, ${added} nuevas agregadas.`,'ok');
  } catch(e){
    setBkdStatus('Error: ' + (e.message||String(e)),'err');
  }
}

/* ===== EXCEL PARSER v5 ===== */
function getNum(row,col){const v=row?row[col]:undefined;if(v==null||v==='')return 0;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[$,%\s]/g,''));return isNaN(n)?0:n;}

function parseExcelData(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject('Error leyendo el archivo');
    reader.onload=e=>{
      try{
        const XLIBX=window.XLSX;if(!XLIBX){reject('SheetJS no disponible');return;}
        const wb=XLIBX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets['Resumen E1-E2'];if(!ws){reject('Hoja "Resumen E1-E2" no encontrada');return;}
        const raw=XLIBX.utils.sheet_to_json(ws,{header:1,defval:null});
        const hdr=raw[2]||[];

        /* Auto-detect E1/E2 column ranges */
        /* E1: cols C-I (indices 2-8) = up to 7 scenarios */
        /* E2: cols U-Z (indices 20-25) = up to 6 scenarios */
        /* Consolidado: AJ-AK (indices 35-36) */
        let E1=[],E2=[],CS=[];
        for(let c=2;c<=8;c++){ if(hdr[c]&&String(hdr[c]).toLowerCase().includes('escen')) E1.push(c); }
        for(let c=20;c<=25;c++){ if(hdr[c]&&String(hdr[c]).toLowerCase().includes('escen')) E2.push(c); }
        for(let c=35;c<=36;c++){ if(hdr[c]) CS.push(c); }

        /* Fallback to v5 defaults */
        if(!E1.length) E1=[2,3,4,5,6,7,8];
        if(!E2.length) E2=[20,21,22,23,24,25];
        if(!CS.length) CS=[35,36];

        const e1Sc=E1.map(c=>String(hdr[c]||'Escenario').replace(/Escenari[oó]\s*/i,'').trim());
        const e2Sc=E2.map(c=>String(hdr[c]||'Escenario').replace(/Escenari[oó]\s*/i,'').trim());
        const csSc=CS.map(c=>String(hdr[c]||'Consolidado').trim());

        const FMAP=[
          ['ingresos','ingreso'],['costoObra','construcción'],
          ['gestionLicencias','gestión, derechos'],['contratistaGeneral','contratista general'],
          ['indirectoCorp','indirecto corporativo'],['gastosOpObra','gastos operativos de obra'],
          ['proyectoEjecutivo','proyecto ejecutivo'],['activosFijos','activos fijos'],
          ['legal','legal'],['sat','sat (bh'],
          ['publicidad','publicidad'],['comisionComercializacion','comisión por comercialización'],
          ['interesesBX','intereses bx'],['comisionAperturaBX','comisión apertura'],
          ['otrosGastosFin','otros gastos financieros'],
          ['costoTierra','costo de la tierra'],['adelantoEtapa2','adelanto etapa 2'],
          ['equipamiento','equipamiento'],
          ['utilidadNeta','utilidad neta'],['margen','margen'],
          ['inversionSocios','inversión inicial'],['devolucion','utilidad total'],
          ['multiplo','multiplo'],['tir','tir'],['aniosProy','años proy'],
          ['negociacion','negociación'],['cargadores','cargadores'],['elevadoresObra','elevadores de obra'],
        ];
        const e1d={},e2d={},csd={};
        FMAP.forEach(([k])=>{e1d[k]=[];e2d[k]=[];csd[k]=[];});

        for(const row of raw){
          const colB=String(row?.[1]||'').toLowerCase().trim();if(!colB)continue;
          for(const[key,pat]of FMAP){
            if(colB.includes(pat)&&!e1d[key].length){
              e1d[key]=E1.map(c=>getNum(row,c));
              e2d[key]=E2.map(c=>getNum(row,c));
              csd[key]=CS.map(c=>getNum(row,c));
              break;
            }
          }
        }

        if(!e1d.ingresos?.length) throw new Error('No se encontraron datos de Ingresos en "Resumen E1-E2"');

        /* Compute derived totals */
        function computeTotals(d,n){
          d.utilidadBruta=Array.from({length:n},(_,i)=>(d.ingresos[i]||0)-(d.costoObra[i]||0));
          d.totalGastosOperativos=Array.from({length:n},(_,i)=>['gestionLicencias','contratistaGeneral','indirectoCorp','gastosOpObra','proyectoEjecutivo','activosFijos','legal','sat'].reduce((s,k)=>s+(d[k]?.[i]||0),0));
          d.totalGastosComercializacion=Array.from({length:n},(_,i)=>(d.publicidad[i]||0)+(d.comisionComercializacion[i]||0));
          d.utilidadOperativa=Array.from({length:n},(_,i)=>(d.utilidadBruta[i]||0)-(d.totalGastosOperativos[i]||0)-(d.totalGastosComercializacion[i]||0));
          d.totalGastosFinancieros=Array.from({length:n},(_,i)=>(d.interesesBX[i]||0)+(d.comisionAperturaBX[i]||0)+(d.otrosGastosFin[i]||0));
          d.totalCostoTierra=Array.from({length:n},(_,i)=>d.costoTierra[i]||0);
          d.devolucionFixos=Array.from({length:n},(_,i)=>(d.devolucion[i]||0)-(d.utilidadNeta[i]||0)-(d.costoTierra[i]||0)-(d.contratistaGeneral[i]||0)-(d.ingresos[i]||0)*0.02);
        }
        computeTotals(e1d,E1.length);
        computeTotals(e2d,E2.length);
        computeTotals(csd,CS.length);

        /* Logrado — col indices: E1 Jul: R(17)=log, S(18)=porLograr; E2 Jul: AG(32)=log, AH(33)=por */
        const logRows={ingresos:'ingreso',costoObra:'construcción',utilidadNeta:'utilidad neta'};
        const lge1={},ple1={},lge2={},ple2={};
        for(const row of raw){
          const colB=String(row?.[1]||'').toLowerCase().trim();
          for(const[k,pat]of Object.entries(logRows)){
            if(colB.includes(pat)&&!lge1[k]){
              lge1[k]=getNum(row,17);ple1[k]=getNum(row,18);
              lge2[k]=getNum(row,32);ple2[k]=getNum(row,33);
            }
          }
        }

        resolve({
          e1:{scenarios:e1Sc,data:e1d},
          e2:{scenarios:e2Sc,data:e2d},
          cons:{scenarios:csSc,data:csd},
          logrado:{e1:{jun:null,jul:{logrado:lge1,porLograr:ple1}},e2:{jun:null,jul:{logrado:lge2,porLograr:ple2}}},
          equity:currentData.equity||null,
          scLabels:currentData.scLabels||null,
          vertientes:currentData.vertientes||null,
        });
      }catch(ex){reject(ex.message||String(ex));}
    };
    reader.readAsArrayBuffer(file);
  });
}

async function handleUpload(){
  const label=document.getElementById('up-label')?.value?.trim(),file=document.getElementById('up-file')?.files?.[0];
  const corte=document.getElementById('up-corte')?.value || new Date().toISOString().slice(0,10);
  if(!label){setStatus('Escribe una etiqueta','err');return;}
  if(!file){setStatus('Selecciona un Excel','err');return;}
  const btn=document.getElementById('up-btn');btn.disabled=true;btn.textContent='Leyendo Excel...';setStatus('Procesando...','info');
  try{
    const parsed=await parseExcelData(file);
    btn.textContent='Subiendo...';setStatus('Guardando en Supabase...','info');
    if(currentData.labels) parsed.labels=currentData.labels;
    parsed.palancas = parsed.palancas || currentData.palancas;
    parsed.equityTotal = parsed.equityTotal || currentData.equityTotal;
    const{error}=await supa.from('cierre_versiones').insert({
      dashboard_id:DASHBOARD_ID, version_label:label,
      fecha_corte:corte,                       // era NOT NULL: sin esto el insert truena
      uploaded_by:userSession.user.email, data:parsed, is_active:true});
    if(error)throw new Error(error.message);
    currentData=parsed;activeVerId=null;usingLive=true;
    if(!currentData.palancas) currentData.palancas=JSON.parse(JSON.stringify(PAL_DEFAULT));
    recalculate('e1');recalculate('e2');recalculate('cons');
    fijarRefConsolidado(); pintarPalancas(); renderAll();
    await cargarCortes();
    document.getElementById('ver-indicator').textContent=label;
    document.getElementById('ver-live').style.display='block';
    await loadVersionHistory();setStatus('Version "'+label+'" subida y activada.','ok');
    btn.textContent='Subir y activar';btn.disabled=false;document.getElementById('up-file').value='';
    setTimeout(()=>renderAdminPanel(),1500);
  }catch(ex){setStatus('Error: '+(ex.message||String(ex)),'err');btn.textContent='Subir y activar';btn.disabled=false;}
}

/* ===== INIT ===== */
async function init(){
  if(!supa){
    // Sin Supabase no hay forma de autenticar: no se muestra nada.
    mostrarGate('Configuracion incompleta: no hay conexion con el servidor.');
    return;
  }
  const {data:{session:s0}} = await supa.auth.getSession();
  if(s0){ userSession=s0; await arrancarSesion(); }
  else   { mostrarGate(''); }
}

init();
</script>
